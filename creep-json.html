<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreepJS JSON Dump</title>
    <style>
      body {
        background: #0d1117;
        color: #e6edf3;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 20px;
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        font-size: 16px;
        color: #58a6ff;
        margin: 0 0 4px;
      }
      p.hint {
        font-size: 12px;
        color: #8b949e;
        margin: 0 0 12px;
      }
      .btn-row {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      #copy-btn {
        background: #238636;
        color: #ffffff;
        border: 1px solid #2ea043;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.15s;
      }
      #copy-btn:hover {
        background: #2ea043;
      }
      #copy-btn:active {
        background: #196c2e;
      }
      #copy-structure-btn {
        background: #1f6feb;
        color: #ffffff;
        border: 1px solid #388bfd;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.15s;
      }
      #copy-structure-btn:hover {
        background: #388bfd;
      }
      #copy-structure-btn:active {
        background: #1158c7;
      }
      pre {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 16px;
        overflow: auto;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .section-label {
        font-size: 13px;
        font-weight: bold;
        color: #7ee787;
        margin: 20px 0 8px;
      }
      .hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
    </style>
  </head>
  <body>
    <h1>CreepJS JSON Dump</h1>
    <p class="hint">Đang chạy creep.js... Kết quả JSON sẽ hiện bên dưới sau vài giây.</p>
    <div class="btn-row">
      <button id="copy-btn" onclick="copyAllJson()">Copy JSON</button>
      <button id="copy-structure-btn" onclick="copyStructure()">Copy Structure</button>
    </div>

    <!-- Container ẩn để creep.js render vào (bắt buộc vì creep.js gọi getElementById) -->
    <div class="hidden">
      <div id="fingerprint-data"></div>
      <div id="webrtc-connection"></div>
      <div id="status-info"></div>
    </div>

    <div id="json-output"></div>

    <script src="./creep.js"></script>
    <script>
      function copyAllJson() {
        if (!window.Fingerprint || !window.Creep) {
          alert('Chưa có dữ liệu. Vui lòng đợi creep.js chạy xong.');
          return;
        }
        const data = {
          Fingerprint: window.Fingerprint,
          Creep: window.Creep,
        };
        const json = JSON.stringify(data, null, 2);
        navigator.clipboard
          .writeText(json)
          .then(() => {
            const btn = document.getElementById('copy-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => {
              btn.textContent = originalText;
            }, 1500);
          })
          .catch((err) => {
            console.error('Copy failed:', err);
            alert('Copy thất bại. Xem console để biết chi tiết.');
          });
      }

      // Đệ quy tạo object rỗng: giữ field names, bỏ value thật
      function emptyStructure(obj) {
        if (Array.isArray(obj)) {
          return obj.length > 0 ? [emptyStructure(obj[0])] : [];
        }
        if (obj !== null && typeof obj === 'object') {
          const result = {};
          for (const key of Object.keys(obj)) {
            result[key] = emptyStructure(obj[key]);
          }
          return result;
        }
        return '';
      }

      function copyStructure() {
        if (!window.Fingerprint || !window.Creep) {
          alert('Chưa có dữ liệu. Vui lòng đợi creep.js chạy xong.');
          return;
        }
        const data = {
          Fingerprint: window.Fingerprint,
          Creep: window.Creep,
        };
        const structure = emptyStructure(data);
        const json = JSON.stringify(structure, null, 2);
        navigator.clipboard
          .writeText(json)
          .then(() => {
            const btn = document.getElementById('copy-structure-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => {
              btn.textContent = originalText;
            }, 1500);
          })
          .catch((err) => {
            console.error('Copy failed:', err);
            alert('Copy thất bại. Xem console để biết chi tiết.');
          });
      }

      (function poll() {
        if (window.Fingerprint && window.Creep) {
          const output = document.getElementById('json-output');

          const fpSection = document.createElement('div');
          fpSection.className = 'section-label';
          fpSection.textContent = 'window.Fingerprint';
          output.appendChild(fpSection);

          const fpPre = document.createElement('pre');
          fpPre.textContent = JSON.stringify(window.Fingerprint, null, 2);
          output.appendChild(fpPre);

          const creepSection = document.createElement('div');
          creepSection.className = 'section-label';
          creepSection.textContent = 'window.Creep';
          output.appendChild(creepSection);

          const creepPre = document.createElement('pre');
          creepPre.textContent = JSON.stringify(window.Creep, null, 2);
          output.appendChild(creepPre);
        } else {
          setTimeout(poll, 500);
        }
      })();
    </script>
  </body>
</html>
