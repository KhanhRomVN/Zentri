<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footprint</title>
    <style>
      /* ============================================================
         TOKENS
         - Nhóm legacy: giữ nguyên để HEADER giống file Marketplace.
         - Nhóm --sf-* / --ink-* / --accent-*: token của UI dựng lại.
         - Tone (--tone): ok / warn / danger / info / mute, dùng cho chip,
           dot, meter. Trạng thái luôn có chữ đi kèm, không chỉ dựa vào màu.
         ============================================================ */
      :root {
        --primary-bg: var(--vscode-editor-background, #1a1b1e);
        --secondary-bg: var(--vscode-sideBar-background, #1a1b1e);
        --tertiary-bg: var(--vscode-panel-background, #202227);
        --hover-bg: var(--vscode-list-hoverBackground, #26282e);

        --primary-text: var(--vscode-foreground, #e4e4e8);
        --secondary-text: var(--vscode-descriptionForeground, #8b8d97);
        --accent-text: var(--vscode-textLink-foreground, #4fc3f7);

        --border-color: var(--vscode-panel-border, #34363d);
        --input-bg: var(--vscode-input-background, #26282e);

        --vscode-focusBorder: #d9a441;
        --vscode-errorForeground: #e0715f;
        --vscode-textLink-foreground: #8ca8cc;
        --vscode-button-background: #d9a441;

        --sf-base: var(--vscode-sideBar-background, #1a1b1e);
        --sf-raise: #202227;
        --sf-sunken: #141519;
        --sf-hover: rgba(255, 255, 255, 0.035);
        --sf-press: rgba(255, 255, 255, 0.07);

        --line: rgba(255, 255, 255, 0.07);
        --line-strong: rgba(255, 255, 255, 0.13);

        --ink-1: var(--vscode-foreground, #e4e4e8);
        --ink-2: #a0a2ad;
        --ink-3: #74767f;

        --accent: #d9a441;
        --accent-hi: #ecba5c;
        --accent-dim: rgba(217, 164, 65, 0.14);
        --accent-line: rgba(217, 164, 65, 0.4);
        --accent-ink: #171308;

        --danger: #e0715f;
        --ok: #79bd8c;
        --warn: #d9a441;
        --info: #8ca8cc;

        --r-sm: 5px;
        --r-md: 8px;
        --r-lg: 11px;

        --mono: var(
          --vscode-editor-font-family,
          'JetBrains Mono',
          'SF Mono',
          ui-monospace,
          Menlo,
          Consolas,
          monospace
        );
      }

      body.vscode-light {
        --sf-raise: #ffffff;
        --sf-sunken: #f1f1f4;
        --sf-hover: rgba(0, 0, 0, 0.035);
        --sf-press: rgba(0, 0, 0, 0.07);
        --line: rgba(0, 0, 0, 0.09);
        --line-strong: rgba(0, 0, 0, 0.16);
        --ink-2: #5a5c66;
        --ink-3: #82848e;
        --accent: #a8762a;
        --accent-hi: #8d6220;
        --accent-dim: rgba(168, 118, 42, 0.12);
        --accent-ink: #ffffff;
        --warn: #a8762a;
        --ok: #3f8a58;
        --danger: #c4503f;
        --info: #4a6d99;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--primary-bg);
        color: var(--primary-text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button:disabled {
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-radius: 3px;
      }
      .mono {
        font-family: var(--mono);
      }

      .scroll-y {
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
      }
      .scroll-y:hover {
        scrollbar-color: var(--line-strong) transparent;
      }
      .scroll-y::-webkit-scrollbar {
        width: 10px;
      }
      .scroll-y::-webkit-scrollbar-thumb {
        background-color: transparent;
        border: 3px solid transparent;
        border-radius: 99px;
        background-clip: content-box;
      }
      .scroll-y:hover::-webkit-scrollbar-thumb {
        background-color: var(--line-strong);
      }

      /* Phone frame — wrapper preview trung tính */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .phone-frame {
        position: relative;
        width: min(420px, 90vw);
        height: min(860px, 90vh);
        aspect-ratio: 9 / 19.5;
        margin: auto;
      }
      .marketplace-panel {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: var(--sf-base);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---------- HEADER (wrapper của modal, không thuộc phạm vi redesign) ---------- */
      .marketplace-header {
        padding: 16px 16px 10px;
        border-top: 1px solid var(--border-color);
        flex-shrink: 0;
        background-color: var(--tertiary-bg);
      }
      .marketplace-header__row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .marketplace-header__title-wrap {
        margin-bottom: 3px;
      }
      .marketplace-header__title {
        font-weight: 700;
        font-size: 16px;
        color: var(--primary-text);
        letter-spacing: 0.01em;
      }
      .marketplace-header__subtitle {
        margin: 0;
        font-size: 13px;
        color: var(--secondary-text);
        opacity: 0.7;
        line-height: 1.4;
      }
      .marketplace-header__close {
        padding: 5px;
        border-radius: 6px;
        flex-shrink: 0;
        background-color: rgba(128, 128, 128, 0.1);
        border: none;
        color: var(--secondary-text);
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .marketplace-header__close:hover {
        background-color: rgba(239, 68, 68, 0.12);
        color: var(--vscode-errorForeground);
      }

      .marketplace-content {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      /* ============================================================
         Shared bits: tones, chips, dots, buttons, meters
         ============================================================ */
      .tone-ok {
        --tone: var(--ok);
      }
      .tone-warn {
        --tone: var(--warn);
      }
      .tone-danger {
        --tone: var(--danger);
      }
      .tone-info {
        --tone: var(--info);
      }
      .tone-mute {
        --tone: var(--ink-2);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 18px;
        padding: 0 7px;
        border-radius: 99px;
        font-size: 10.5px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        color: var(--tone, var(--ink-2));
        background-color: color-mix(in srgb, var(--tone, var(--ink-2)) 14%, transparent);
      }
      .chip--mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 99px;
        flex-shrink: 0;
        background-color: var(--tone, var(--ink-3));
      }
      .tag {
        font-size: 10.5px;
        line-height: 1.4;
        padding: 1px 5px;
        border-radius: 4px;
        color: var(--ink-3);
        border: 1px solid var(--line);
        white-space: nowrap;
      }

      .icon-btn {
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: var(--r-sm);
        background-color: transparent;
        color: var(--ink-3);
        cursor: pointer;
        flex-shrink: 0;
        transition: all 0.12s ease;
      }
      .icon-btn:hover:not(:disabled) {
        background-color: var(--sf-press);
        color: var(--ink-1);
      }
      .icon-btn:disabled {
        opacity: 0.35;
      }
      .icon-btn--danger:hover:not(:disabled) {
        color: var(--danger);
        background-color: color-mix(in srgb, var(--danger) 13%, transparent);
      }

      .btn-mini {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 9px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-strong);
        background-color: transparent;
        color: var(--ink-2);
        font-size: 11.5px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.12s ease;
      }
      .btn-mini:hover {
        color: var(--accent-hi);
        border-color: var(--accent-line);
        background-color: var(--accent-dim);
      }
      .btn-ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 11px;
        border-radius: var(--r-md);
        border: 1px solid var(--line-strong);
        background-color: transparent;
        color: var(--ink-1);
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.12s ease;
      }
      .btn-ghost:hover:not(:disabled) {
        background-color: var(--sf-hover);
        border-color: var(--accent-line);
        color: var(--accent-hi);
      }
      .btn-ghost--danger:hover:not(:disabled) {
        border-color: color-mix(in srgb, var(--danger) 45%, transparent);
        color: var(--danger);
        background-color: color-mix(in srgb, var(--danger) 10%, transparent);
      }
      .btn-primary {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 32px;
        border-radius: var(--r-md);
        border: none;
        background-color: var(--accent);
        color: var(--accent-ink);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.12s ease;
      }
      .btn-primary:hover:not(:disabled) {
        background-color: var(--accent-hi);
      }
      .btn-primary:disabled {
        opacity: 0.7;
      }
      .btn-solid-danger {
        height: 30px;
        padding: 0 12px;
        border: none;
        border-radius: var(--r-md);
        background-color: var(--danger);
        color: #1c0b08;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-solid-danger:hover {
        filter: brightness(1.08);
      }
      .btn-quiet {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px;
        border-radius: var(--r-md);
        border: 1px solid var(--line-strong);
        background-color: transparent;
        color: var(--ink-1);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.12s ease;
      }
      .btn-quiet:hover {
        background-color: var(--sf-hover);
        border-color: var(--accent-line);
        color: var(--accent-hi);
      }
      .link-btn {
        border: none;
        background: none;
        padding: 0;
        color: var(--info);
        font-size: 12px;
        cursor: pointer;
      }
      .link-btn:hover {
        text-decoration: underline;
      }

      .meter {
        position: relative;
        height: 4px;
        border-radius: 99px;
        background-color: var(--sf-press);
        overflow: hidden;
      }
      .meter > i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background-color: var(--tone, var(--ok));
      }

      .spin {
        display: inline-flex;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Segmented (dùng cho Cookies / Local / Session) */
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: var(--r-md);
        background-color: var(--sf-sunken);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .seg__item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 11px;
        border: none;
        border-radius: 6px;
        background-color: transparent;
        color: var(--ink-3);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.12s ease;
      }
      .seg__item:hover {
        color: var(--ink-1);
      }
      .seg__item.is-active {
        background-color: var(--sf-raise);
        color: var(--ink-1);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .seg__badge {
        font-family: var(--mono);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        color: var(--ink-3);
      }
      .seg__item.is-active .seg__badge {
        color: var(--accent);
      }

      /* Search field */
      .field {
        position: relative;
        display: flex;
        align-items: center;
      }
      .field__icon {
        position: absolute;
        left: 11px;
        color: var(--ink-3);
        pointer-events: none;
        display: flex;
      }
      .field__input {
        width: 100%;
        height: 34px;
        padding: 0 32px 0 32px;
        border-radius: var(--r-md);
        border: 1px solid var(--line);
        background-color: var(--sf-sunken);
        color: var(--ink-1);
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.12s ease,
          background-color 0.12s ease;
      }
      .field__input::placeholder {
        color: var(--ink-3);
      }
      .field__input:focus {
        border-color: var(--accent-line);
        background-color: var(--sf-raise);
      }
      .field__clear {
        position: absolute;
        right: 6px;
        width: 22px;
        height: 22px;
        border: none;
        border-radius: var(--r-sm);
        background-color: transparent;
        color: var(--ink-3);
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .field__clear:hover {
        background-color: var(--sf-press);
        color: var(--ink-1);
      }
      .field__clear.is-visible {
        display: flex;
      }

      /* ============================================================
         FOOTPRINT — list view
         ============================================================ */
      .fp {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      /* Thanh tổng quan — cũng là bộ lọc nhanh */
      .fp-summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        flex-shrink: 0;
        border-bottom: 1px solid var(--line);
        background-color: var(--tertiary-bg);
      }
      .fp-stat {
        position: relative;
        padding: 10px 12px 9px;
        text-align: left;
        border: none;
        background: none;
        color: inherit;
        cursor: pointer;
        transition: background-color 0.12s ease;
      }
      .fp-stat + .fp-stat {
        border-left: 1px solid var(--line);
      }
      .fp-stat:hover {
        background-color: var(--sf-hover);
      }
      .fp-stat.is-active {
        background-color: var(--accent-dim);
      }
      .fp-stat.is-active::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background-color: var(--accent);
      }
      .fp-stat__value {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }
      .fp-stat__label {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 3px;
        font-size: 10.5px;
        color: var(--ink-3);
        white-space: nowrap;
      }

      .fp-toolbar {
        flex-shrink: 0;
        padding: 10px 12px 0;
      }
      .fp-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px 6px;
        flex-shrink: 0;
      }
      .fp-meta-row__count {
        font-size: 11px;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }
      .fp-sort {
        height: 22px;
        border: none;
        background-color: transparent;
        color: var(--ink-2);
        font-size: 11px;
        cursor: pointer;
        border-radius: var(--r-sm);
        padding: 0 4px;
      }
      .fp-sort:hover {
        background-color: var(--sf-hover);
        color: var(--ink-1);
      }
      .fp-sort option {
        background-color: var(--sf-raise);
        color: var(--ink-1);
      }

      .fp-table-wrap {
        flex: 1;
        min-height: 0;
      }
      .fp.has-selection .fp-table-wrap {
        padding-bottom: 66px;
      }
      .fp-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .fp-table th {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 6px 6px;
        text-align: left;
        font-size: 10.5px;
        font-weight: 500;
        color: var(--ink-3);
        background-color: var(--sf-base);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .fp-table td {
        height: 52px;
        padding: 0 6px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
        overflow: hidden;
      }
      .fp-table th:first-child,
      .fp-table td:first-child {
        padding-left: 12px;
      }
      .fp-table th:last-child,
      .fp-table td:last-child {
        padding-right: 12px;
      }
      .fp-row {
        cursor: pointer;
      }
      .fp-row:hover td {
        background-color: var(--sf-hover);
      }
      .fp-row:hover td:first-child,
      .fp-row.is-selected td:first-child {
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .fp-row.is-selected td {
        background-color: var(--accent-dim);
      }

      .c-domain {
        min-width: 0;
      }
      .c-domain .n {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-domain .m {
        display: flex;
        gap: 7px;
        margin-top: 3px;
        font-size: 10.5px;
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
      }
      .c-a {
        display: block;
        font-family: var(--mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .c-b {
        display: block;
        margin-top: 3px;
        font-size: 10.5px;
        color: var(--ink-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .st {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--tone, var(--ink-2));
        white-space: nowrap;
      }
      .st.mono {
        font-family: var(--mono);
      }

      /* Checkbox */
      .cb {
        width: 16px;
        height: 16px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        border: 1px solid var(--line-strong);
        background-color: var(--sf-sunken);
        color: transparent;
        cursor: pointer;
        transition: all 0.12s ease;
      }
      .cb:hover {
        border-color: var(--accent-line);
      }
      .cb.is-on,
      .cb.is-mixed {
        background-color: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }

      /* Skeleton */
      .sk-line {
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          var(--sf-press) 0%,
          var(--sf-hover) 40%,
          var(--sf-press) 80%
        );
        background-size: 280% 100%;
        animation: sk 1.4s ease-in-out infinite;
      }
      @keyframes sk {
        from {
          background-position: 130% 0;
        }
        to {
          background-position: -60% 0;
        }
      }

      /* Empty state */
      .state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 6px;
        padding: 48px 24px;
        color: var(--ink-3);
      }
      .state__icon {
        width: 40px;
        height: 40px;
        border-radius: var(--r-lg);
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: color-mix(in srgb, var(--tone, var(--ink-3)) 13%, transparent);
        color: var(--tone, var(--ink-3));
        margin-bottom: 4px;
      }
      .state__title {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-1);
      }
      .state__body {
        margin: 0;
        max-width: 260px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--ink-3);
      }
      .state .btn-quiet {
        margin-top: 10px;
      }

      /* Bulk bar */
      .fp-bulk {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 6px 6px 8px;
        border-radius: var(--r-lg);
        background-color: var(--sf-raise);
        box-shadow:
          0 0 0 1px var(--line-strong),
          0 10px 28px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translateY(14px);
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
      }
      .fp-bulk.is-open {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .fp-bulk__count {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fp-bulk .btn-ghost {
        height: 28px;
        padding: 0 9px;
        font-size: 11.5px;
      }

      /* Popover */
      .pop {
        position: absolute;
        z-index: 70;
        min-width: 190px;
        max-width: 240px;
        padding: 4px;
        border-radius: var(--r-md);
        background-color: var(--sf-raise);
        box-shadow:
          0 0 0 1px var(--line-strong),
          0 10px 28px rgba(0, 0, 0, 0.45);
      }
      .pop__item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 7px 8px;
        border: none;
        border-radius: var(--r-sm);
        background-color: transparent;
        color: var(--ink-1);
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      .pop__item:hover {
        background-color: var(--sf-press);
      }
      .pop__note {
        padding: 6px 8px 5px;
        font-size: 10.5px;
        line-height: 1.45;
        color: var(--ink-3);
        border-top: 1px solid var(--line);
        margin-top: 4px;
      }

      /* Confirm dialog */
      .dlg {
        position: absolute;
        inset: 0;
        z-index: 80;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .dlg.is-open {
        display: flex;
      }
      .dlg__scrim {
        position: absolute;
        inset: 0;
        background-color: rgba(8, 9, 11, 0.62);
      }
      .dlg__box {
        position: relative;
        width: 100%;
        max-width: 320px;
        padding: 16px;
        border-radius: var(--r-lg);
        background-color: var(--sf-raise);
        box-shadow:
          0 0 0 1px var(--line-strong),
          0 16px 48px rgba(0, 0, 0, 0.55);
      }
      .dlg__title {
        margin: 0 0 6px;
        font-size: 13.5px;
        font-weight: 650;
      }
      .dlg__body {
        margin: 0 0 14px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--ink-2);
      }
      .dlg__actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      /* Toast */
      .toast {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 11px;
        border-radius: var(--r-md);
        background-color: var(--sf-raise);
        box-shadow:
          0 0 0 1px var(--line-strong),
          0 8px 24px rgba(0, 0, 0, 0.4);
        font-size: 12px;
        color: var(--ink-1);
        opacity: 0;
        transform: translateY(6px);
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
      }
      .toast.is-open {
        opacity: 1;
        transform: none;
      }
      .toast__icon {
        display: flex;
        flex-shrink: 0;
        color: var(--ok);
      }
      .toast.is-danger .toast__icon {
        color: var(--danger);
      }

      /* ============================================================
         FOOTPRINT — detail modal (phủ gần hết panel, có tab bên trong)
         ============================================================ */
      .fp-modal {
        position: absolute;
        inset: 0;
        z-index: 40;
        visibility: hidden;
        transition: visibility 0s linear 0.2s;
      }
      .fp-modal.is-open {
        visibility: visible;
        transition-delay: 0s;
      }
      .fp-modal__scrim {
        position: absolute;
        inset: 0;
        background-color: rgba(8, 9, 11, 0.62);
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .fp-modal.is-open .fp-modal__scrim {
        opacity: 1;
      }
      .fp-modal__sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: 26px;
        display: flex;
        flex-direction: column;
        border-radius: 14px 14px 0 0;
        background-color: var(--sf-base);
        box-shadow:
          0 -1px 0 var(--line-strong),
          0 -14px 40px rgba(0, 0, 0, 0.5);
        transform: translateY(100%);
        transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
      }
      .fp-modal.is-open .fp-modal__sheet {
        transform: none;
      }

      .tile {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: var(--r-lg);
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--tile);
        background-color: color-mix(in srgb, var(--tile) 14%, transparent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tile) 26%, transparent);
      }
      .m-head {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        padding: 14px 10px 12px 14px;
        flex-shrink: 0;
      }
      .m-head__id {
        flex: 1;
        min-width: 0;
        padding-top: 1px;
      }
      .m-head__domain {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        line-height: 1.3;
        word-break: break-all;
      }
      .m-head__sub {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        margin-top: 5px;
        font-size: 11px;
        color: var(--ink-3);
      }
      .m-head__tools {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }

      .m-tabs {
        display: flex;
        gap: 2px;
        padding: 0 8px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .m-tabs::-webkit-scrollbar {
        display: none;
      }
      .m-tab {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        padding: 9px 9px 10px;
        border: none;
        background: none;
        color: var(--ink-3);
        font-size: 12.5px;
        white-space: nowrap;
        cursor: pointer;
        transition: color 0.12s ease;
      }
      .m-tab:hover {
        color: var(--ink-2);
      }
      .m-tab.is-active {
        color: var(--ink-1);
        font-weight: 600;
      }
      .m-tab.is-active::after {
        content: '';
        position: absolute;
        left: 7px;
        right: 7px;
        bottom: -1px;
        height: 2px;
        border-radius: 2px 2px 0 0;
        background-color: var(--accent);
      }
      .m-tab__badge {
        font-family: var(--mono);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        line-height: 1.5;
        padding: 0 5px;
        border-radius: 99px;
        color: var(--tone, var(--ink-3));
        background-color: color-mix(in srgb, var(--tone, var(--ink-3)) 16%, transparent);
      }

      .m-body {
        flex: 1;
        min-height: 0;
      }
      .m-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background-color: var(--tertiary-bg);
      }

      .sec {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }
      .sec:last-child {
        border-bottom: none;
      }
      .sec__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 10px;
      }
      .sec__title {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-1);
      }
      .sec__hint {
        font-size: 11px;
        color: var(--ink-3);
      }
      .sec__lead {
        margin: 0 0 10px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--ink-2);
      }

      /* Overview */
      .risk__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .risk__score {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
      }
      .risk__meter {
        height: 6px;
      }
      .risk__meter u {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background-color: var(--sf-base);
      }
      .risk__scale {
        display: flex;
        margin-top: 5px;
        font-size: 10.5px;
        color: var(--ink-3);
      }
      .risk__scale span:nth-child(1) {
        width: 25%;
      }
      .risk__scale span:nth-child(2) {
        width: 35%;
      }
      .why {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .why li {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        line-height: 1.4;
      }
      .why li span:first-of-type {
        flex: 1;
        min-width: 0;
      }
      .why small {
        color: var(--ink-3);
        font-size: 10.5px;
        white-space: nowrap;
      }
      .why-empty {
        margin: 12px 0 0;
        font-size: 12px;
        color: var(--ink-3);
      }

      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--line);
      }
      .fact {
        padding: 11px 14px;
        min-width: 0;
        border-top: 1px solid var(--line);
      }
      .fact:nth-child(-n + 2) {
        border-top: none;
      }
      .fact:nth-child(even) {
        border-left: 1px solid var(--line);
      }
      .fact__v {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font-size: 12.5px;
        font-weight: 600;
      }
      .fact__v .mono {
        font-size: 12px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fact__l {
        margin-top: 4px;
        font-size: 10.5px;
        color: var(--ink-3);
      }

      .streak + .streak {
        margin-top: 12px;
      }
      .streak__row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .streak__row span:last-child {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--ink-2);
      }

      .chart {
        display: block;
        width: 100%;
        height: 64px;
      }
      .chart-axis {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 10.5px;
        color: var(--ink-3);
      }

      /* IP timeline */
      .chips-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .strip {
        display: flex;
        gap: 1px;
        height: 14px;
        border-radius: 5px;
        overflow: hidden;
        background-color: var(--sf-sunken);
      }
      .strip i {
        min-width: 3px;
      }
      .tl {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .tl__item {
        position: relative;
        padding: 0 0 18px 22px;
      }
      .tl__item:last-child {
        padding-bottom: 0;
      }
      .tl__item::before {
        content: '';
        position: absolute;
        left: 4px;
        top: 12px;
        bottom: -2px;
        width: 1px;
        background-color: var(--line-strong);
      }
      .tl__item:last-child::before {
        display: none;
      }
      .tl__node {
        position: absolute;
        left: 0;
        top: 3px;
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background-color: var(--c);
        box-shadow: 0 0 0 3px var(--sf-base);
      }
      .tl__ip {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
      }
      .tl__ip b {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 600;
      }
      .tl__org {
        margin-top: 3px;
        font-size: 11.5px;
        color: var(--ink-2);
      }
      .tl__time {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
        margin-top: 3px;
        font-size: 11px;
        color: var(--ink-3);
      }
      .tl__note {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font-size: 11.5px;
        color: var(--tone);
      }

      /* Fingerprint diff */
      .cmp {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .cmp label {
        display: block;
        margin-bottom: 4px;
        font-size: 10.5px;
        color: var(--ink-3);
      }
      .cmp select {
        width: 100%;
        height: 30px;
        padding: 0 8px;
        border-radius: var(--r-md);
        border: 1px solid var(--line);
        background-color: var(--sf-sunken);
        color: var(--ink-1);
        font-size: 12px;
        cursor: pointer;
      }
      .cmp select:focus {
        border-color: var(--accent-line);
        outline: none;
      }
      .cmp select option {
        background-color: var(--sf-raise);
      }
      .drift {
        display: flex;
        gap: 3px;
        margin: 10px 0 8px;
      }
      .drift i {
        flex: 1;
        height: 6px;
        border-radius: 2px;
        background-color: var(--sf-press);
      }
      .drift i.is-changed {
        background-color: var(--warn);
      }
      .drift-note {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
      }
      .drift-note span:last-child {
        color: var(--ink-3);
        font-size: 11px;
      }
      .diff-row {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .diff-row__label {
        font-size: 11.5px;
        font-weight: 600;
      }
      .diff-line {
        display: flex;
        gap: 8px;
        margin-top: 4px;
        padding: 3px 8px;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.55;
        word-break: break-all;
      }
      .diff-line b {
        width: 8px;
        flex-shrink: 0;
        font-weight: 400;
        opacity: 0.75;
      }
      .diff-line--del {
        color: color-mix(in srgb, var(--danger) 82%, var(--ink-1));
        background-color: color-mix(in srgb, var(--danger) 12%, transparent);
      }
      .diff-line--add {
        color: color-mix(in srgb, var(--ok) 82%, var(--ink-1));
        background-color: color-mix(in srgb, var(--ok) 12%, transparent);
      }
      .same-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .same-row span:last-child {
        font-family: var(--mono);
        font-size: 11px;
        text-align: right;
        word-break: break-all;
        color: var(--ink-2);
      }
      .diff-toggle {
        padding: 10px 14px;
      }

      /* Sync */
      .sync-hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .sync-hero__t {
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sync-hero__s {
        margin-top: 4px;
        font-size: 11.5px;
        color: var(--ink-3);
        line-height: 1.5;
      }
      .scope {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .scope:first-of-type {
        border-top: none;
        padding-top: 0;
      }
      .scope span:first-child {
        flex: 1;
      }
      .scope small {
        color: var(--ink-3);
        font-size: 11px;
        min-width: 52px;
        text-align: right;
      }
      .log {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .log li {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        font-size: 11.5px;
        line-height: 1.45;
      }
      .log li:first-child {
        border-top: none;
        padding-top: 0;
      }
      .log .dot {
        margin-top: 5px;
      }
      .log__msg {
        flex: 1;
        min-width: 0;
        color: var(--ink-2);
      }
      .log__msg b {
        display: block;
        font-weight: 500;
        color: var(--ink-1);
      }
      .log__r {
        text-align: right;
        white-space: nowrap;
        font-size: 10.5px;
        color: var(--ink-3);
      }
      .log__r span {
        display: block;
        font-family: var(--mono);
        margin-top: 2px;
      }

      /* Storage */
      .kv-sum {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        margin-bottom: 12px;
        font-size: 12px;
        color: var(--ink-2);
      }
      .kv-sum b {
        color: var(--ink-1);
        font-family: var(--mono);
        font-weight: 600;
      }
      .kv-tools {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .kv {
        padding: 10px 14px 10px;
        border-top: 1px solid var(--line);
      }
      .kv:last-child {
        border-bottom: 1px solid var(--line);
      }
      .kv__top {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .kv__name {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .kv__val {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
      }
      .kv__val code {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .kv__val .icon-btn {
        width: 22px;
        height: 22px;
      }
      .kv__tags {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
        margin-top: 5px;
      }
      .kv__sz {
        margin-left: auto;
        font-size: 10.5px;
        color: var(--ink-3);
        font-family: var(--mono);
      }

      /* Alerts */
      .alert {
        padding: 12px 14px;
        border-top: 1px solid var(--line);
      }
      .alert:first-child {
        border-top: none;
      }
      .alert__top {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .alert__time {
        margin-left: auto;
        font-size: 10.5px;
        color: var(--ink-3);
      }
      .alert__title {
        margin-top: 8px;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.4;
      }
      .alert__detail {
        margin: 4px 0 0;
        font-size: 12px;
        line-height: 1.55;
        color: var(--ink-2);
      }
      .alert__acts {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .alert.is-closed .alert__title {
        color: var(--ink-2);
        font-weight: 500;
      }
      .list-head {
        padding: 12px 14px 8px;
        font-size: 12px;
        font-weight: 600;
        border-top: 1px solid var(--line);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="marketplace-panel" id="panel">
        <!-- ========== HEADER (wrapper modal — không nằm trong phạm vi redesign) ========== -->
        <div class="marketplace-header">
          <div class="marketplace-header__row">
            <div>
              <div class="marketplace-header__title-wrap">
                <span class="marketplace-header__title">Footprint</span>
              </div>
              <p class="marketplace-header__subtitle">
                IP, fingerprint and sync status for every domain you visit
              </p>
            </div>
            <button
              class="marketplace-header__close"
              type="button"
              title="Close"
              aria-label="Close"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
        </div>

        <div class="marketplace-content">
          <div class="fp" id="fp">
            <!-- Tổng quan = bộ lọc nhanh -->
            <div class="fp-summary" id="fp-summary"></div>

            <div class="fp-toolbar">
              <div class="field">
                <span class="field__icon" id="search-icon"></span>
                <input
                  id="search"
                  class="field__input"
                  type="text"
                  placeholder="Search domain or IP"
                  autocomplete="off"
                  spellcheck="false"
                />
                <button
                  id="search-clear"
                  class="field__clear"
                  type="button"
                  title="Clear search"
                  aria-label="Clear search"

            return d && !state.busy.has(d.domain);
          });
          if (!list.length) return;
          list.forEach(function (d) {
            state.busy.add(d.domain);
          });
          renderAll();
          var done = 0,
            fails = 0;
          list.forEach(function (d, i) {
            setTimeout(
              function () {
                var ok = doResync(d);
                state.busy['delete'](d.domain);
                if (!ok) fails++;
                done++;
                renderAll();
                if (done === list.length) {
                  if (fails)
                    toast(
                      list.length - fails + ' synced, ' + fails + ' failed. Retry the failed ones.',
                      'danger',
                    );
                  else
                    toast(
                      list.length === 1
                        ? 'Synced ' + list[0].domain
                        : 'Synced ' + list.length + ' domains',
                    );
                }
              },
              700 + i * 260,
            );
          });
        }

        // ---------------- export ----------------
        function download(name, mime, text) {
          try {
            var blob = new Blob([text], { type: mime });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () {
              URL.revokeObjectURL(url);
            }, 1000);
          } catch (err) {
            /* sandbox có thể chặn download */
          }
        }
        function iso(t) {
          return new Date(t).toISOString();
        }
        function exportRecord(d) {
          var f = latestFp(d),
            ip = curIp(d);
          return {
            domain: d.domain,
            visits: d.visits,
            firstSeen: iso(d.first),
            lastSeen: iso(d.last),
            currentIp: { ip: ip.ip, country: ip.cc, asn: ip.asn, org: ip.org },
            ipHistory: d.ips.map(function (p) {
              return {
                ip: p.ip,
                country: p.cc,
                asn: p.asn,
                org: p.org,
                since: iso(p.start),
              };
            }),
            fingerprint: {
              currentVersion: f.v,
              attributes: f.attrs,
              history: d.fpv.map(function (v) {
                return { version: v.v, at: iso(v.t), changed: v.changed };
              }),
            },
            sync: {
              status: syncStatus(d),
              lastSuccess: lastSuccess(d) ? iso(lastSuccess(d)) : null,
            },
            storage: {
              cookies: d.storage.cookies.length,
              localStorage: d.storage.local.length,
              sessionStorage: d.storage.session.length,
            },
            risk: {
              score: score(d),
              level: level(score(d)),
              openAlerts: openAlerts(d).map(function (a) {
                return { severity: a.sev, type: a.type, title: a.title };
              }),
            },
          };
        }
        function csvCell(v) {
          return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        }
        function exportCsv(list) {
          var head = [
            'domain',
            'visits',
            'first_seen',
            'last_seen',
            'current_ip',
            'country',
            'asn',
            'fingerprint_version',
            'drifted_7d',
            'sync_status',
            'last_sync',
            'risk_score',
            'risk_level',
            'open_alerts',
          ];
          var rows = list.map(function (d) {
            var ip = curIp(d),
              ls = lastSuccess(d);
            return [
              d.domain,
              d.visits,
              iso(d.first),
              iso(d.last),
              ip.ip,
              ip.cc,
              ip.asn,
              latestFp(d).v,
              isDrift(d),
              syncStatus(d),
              ls ? iso(ls) : '',
              score(d),
              level(score(d)),
              openAlerts(d).length,
            ]
              .map(csvCell)
              .join(',');
          });
          return [head.join(',')].concat(rows).join('\n');
        }
        function doExport(names, fmt) {
          var list = names.map(byName).filter(Boolean);
          if (!list.length) return;
          var stamp = new Date().toISOString().slice(0, 10);
          var base = list.length === 1 ? list[0].domain : 'footprint-' + stamp;
          if (fmt === 'csv') download(base + '.csv', 'text/csv', exportCsv(list));
          else
            download(
              base + '.json',
              'application/json',
              JSON.stringify(list.map(exportRecord), null, 2),
            );
          toast('Exported ' + describe(names) + ' as ' + fmt.toUpperCase());
        }

        function activityChart(d) {

            s +=

              '" y="' +

        function ipColorMap(d) {

          });
          return map;

        function viewIp(d) {
          var colors = ipColorMap(d),
            to = Date.now();
          var from = Math.max(to - 30 * DAY, d.first);
          var segs = d.ips
            .map(function (p, i) {
              var s = Math.max(p.start, from),
                e = d.ips[i + 1] ? d.ips[i + 1].start : to;
              return { p: p, dur: e - s, e: e };
            })
            .filter(function (x) {
              return x.dur > 0 && x.e > from;
            });
          var w = d.ips.filter(function (p, i) {
            var e = d.ips[i + 1] ? d.ips[i + 1].start : to;
            return e > from;
          });
          var uIps = new Set(
            w.map(function (p) {
              return p.ip;
            }),
          ).size;
          var uCc = new Set(
            w.map(function (p) {
              return p.cc;
            }),
          ).size;
          var uAsn = new Set(
            w.map(function (p) {
              return p.asn;
            }),
          ).size;
          var spanDays = Math.min(30, Math.round((to - d.first) / DAY));

          var items = d.ips
            .map(function (p, i) {
              var prev = d.ips[i - 1],
                end = d.ips[i + 1] ? d.ips[i + 1].start : null;
              var note = '';

            })
            .reverse()
            .join('');

          return (
            '<section class="sec"><div class="chips-row"><span class="chip tone-mute">' +
            uIps +
            (uIps === 1 ? ' IP' : ' IPs') +
            '</span><span class="chip tone-mute">' +

            '</div>' +
            '<div class="chart-axis"><span>' +
            (spanDays >= 30 ? '30d ago' : 'First seen') +
            '</span><span>Now</span></div></section>' +
            '<section class="sec"><div class="sec__head"><h4 class="sec__title">History</h4><span class="sec__hint">Newest first</span></div><ol class="tl">' +
            items +
            '</ol></section>'
          );
        }

        function viewFp(d) {
          var vs = d.fpv;
          if (vs.length < 2) {
            return (
              emptyState(
                ICON.fingerprint,
                'mute',
                'Only one fingerprint so far',
                'A new version is saved whenever an attribute changes. There is nothing to compare yet.',
              ) +
              '<section class="sec"><div class="sec__head"><h4 class="sec__title">Current attributes</h4></div></section>' +
              sameRows(
                vs[0].attrs,
                FP_ATTRS.map(function (a) {
                  return a[0];
                }),
              )
            );
          }
          if (!state.cmp || state.cmp.domain !== d.domain)
            state.cmp = { domain: d.domain, a: vs.length - 1, b: vs.length };
          var a = vs[state.cmp.a - 1],
            b = vs[state.cmp.b - 1];
          var changed = [],
            same = [];
          FP_ATTRS.forEach(function (x) {
            (a.attrs[x[0]] !== b.attrs[x[0]] ? changed : same).push(x[0]);
          });
          var n = changed.length,
            lvl =
              n === 0
                ? ['No drift', 'ok']
                : n <= 2
                  ? ['Minor drift', 'info']
                  : n <= 5
                    ? ['Notable drift', 'warn']
                    : ['Major drift', 'danger'];
          function opts(sel) {
            return vs
              .map(function (v) {
                return (
                  '<option value="' +
                  v.v +
                  '"' +
                  (v.v === sel ? ' selected' : '') +
                  '>v' +
                  v.v +
                  ' (' +
                  ago(v.t) +
                  ')</option>'
                );
              })
              .join('');
          }
          var label = {};
          FP_ATTRS.forEach(function (x) {
            label[x[0]] = x[1];
          });

          return (
            '<section class="sec"><div class="cmp"><div><label for="cmp-a">Compare</label><select id="cmp-a" data-cmp="a">' +
            opts(state.cmp.a) +
            '</select></div><div><label for="cmp-b">With</label><select id="cmp-b" data-cmp="b">' +
            opts(state.cmp.b) +
            '</select></div></div>' +
            '<div class="drift" role="img" aria-label="' +
            n +
            ' of ' +
            FP_ATTRS.length +
            ' attributes changed">' +
            FP_ATTRS.map(function (x) {
              return '<i' + (changed.indexOf(x[0]) !== -1 ? ' class="is-changed"' : '') + '></i>';
            }).join('') +
            '</div>' +
            '<div class="drift-note"><span class="st tone-' +
            lvl[1] +
            '"><i class="dot"></i>' +
            lvl[0] +
            '</span><span>' +
            n +
            ' of ' +
            FP_ATTRS.length +
            ' attributes changed</span></div></section>' +
            (n
              ? changed
                  .map(function (k) {
                    return (
                      '<div class="diff-row"><div class="diff-row__label">' +
                      label[k] +
                      '</div><div class="diff-line diff-line--del"><b>−</b><span>' +
                      esc(a.attrs[k]) +
                      '</span></div><div class="diff-line diff-line--add"><b>+</b><span>' +
                      esc(b.attrs[k]) +
                      '</span></div></div>'
                    );
                  })
                  .join('')
              : '<p class="sec__lead" style="padding:14px 14px 0">These two versions are identical.</p>') +
            (same.length
              ? '<div class="diff-toggle"><button class="link-btn" type="button" data-act="toggle-same">' +
                (state.showSame ? 'Hide' : 'Show') +
                ' ' +
                same.length +
                ' unchanged</button></div>' +
                (state.showSame ? sameRows(b.attrs, same) : '')
              : '')
          );
        }
        function sameRows(attrs, keys) {
          var label = {};
          FP_ATTRS.forEach(function (x) {
            label[x[0]] = x[1];
          });
          return keys
            .map(function (k) {
              return (
                '<div class="same-row"><span>' +
                label[k] +
                '</span><span>' +
                esc(attrs[k]) +
                '</span></div>'
              );
            })
            .join('');
        }

        function latencyChart(log) {
          var W_ = 360,
            H = 64,
            n = log.length,
            gap = 4,
            bw = (W_ - gap * (n - 1)) / n;
          var max = Math.max.apply(
            null,
            [1500].concat(
              log.map(function (e) {
                return e.ms || 0;
              }),
            ),
          );
          var s =
            '<svg class="chart" viewBox="0 0 ' +
            W_ +
            ' ' +
            H +
            '" preserveAspectRatio="none" role="img" aria-label="Sync latency for the last ' +
            n +
            ' checks">';
          log.forEach(function (e, i) {
            var x = (i * (bw + gap)).toFixed(1);
            if (e.ms == null)
              s +=
                '<rect x="' +
                x +
                '" y="0" width="' +
                bw.toFixed(1) +
                '" height="' +
                H +
                '" rx="2" style="fill:var(--danger);opacity:.3"><title>Failed ' +
                ago(e.t) +
                ': ' +
                esc(e.err) +
                '</title></rect>';
            else {
              var h = Math.max(4, Math.round((e.ms / max) * (H - 4)));
              s +=
                '<rect x="' +
                x +
                '" y="' +
                (H - h) +
                '" width="' +
                bw.toFixed(1) +
                '" height="' +
                h +
                '" rx="2" style="fill:var(--ok);opacity:.8"><title>' +
                e.ms +
                ' ms, ' +
                ago(e.t) +
                '</title></rect>';
            }
          });
          return s + '</svg>';
        }
        var SCOPES = [
          ['ip', 'IP record'],
          ['fingerprint', 'Fingerprint'],
          ['cookies', 'Cookies'],
          ['storage', 'Local storage'],
        ];
        function viewSync(d) {
          var ss = syncStatus(d),
            ls = lastSuccess(d),
            log = d.sync.log,
            busy = state.busy.has(d.domain);
          var okMs = log
            .filter(function (e) {
              return e.ms != null;
            })
            .map(function (e) {
              return e.ms;
            });
          var avg = okMs.length
            ? Math.round(
                okMs.reduce(function (a, b) {
                  return a + b;
                }, 0) / okMs.length,
              )
            : 0;
          var fails = log.length - okMs.length;
          var head = ss === 'ok' ? 'Healthy' : ss === 'stale' ? 'Stale' : 'Failing';
          var sub =
            ss === 'error'
              ? 'The last ' +
                (function () {
                  var c = 0;
                  for (var i = log.length - 1; i >= 0 && log[i].err; i--) c++;
                  return c;
                })() +
                ' checks failed. ' +
                esc(d.sync.errMsg) +
                '.'
              : ss === 'stale'
                ? 'Some data is out of date. See what is behind below.'
                : 'All data is in sync with the remote copy.';

          return (
            '<section class="sec"><div class="sync-hero"><div><div class="sync-hero__t"><span class="chip tone-' +
            SYNC_TONE[ss] +
            '"><i class="dot"></i>' +
            head +
            '</span></div>' +
            '<div class="sync-hero__s">Last successful sync ' +
            (ls ? ago(ls) : 'never') +
            '<br>' +
            sub +
            '</div></div>' +
            '<button class="btn-ghost" type="button" data-act="sync-now"' +
            (busy ? ' disabled' : '') +
            '>' +
            (busy
              ? '<span class="spin">' + ICON.refresh + '</span>Syncing'
              : ICON.refresh + 'Retry') +
            '</button></div></section>' +
            '<section class="sec"><div class="sec__head"><h4 class="sec__title">Latency</h4><span class="sec__hint">Avg ' +
            avg +
            ' ms, ' +
            fails +
            (fails === 1 ? ' failed' : ' failed') +
            ' of ' +
            log.length +
            '</span></div>' +
            latencyChart(log) +
            '<div class="chart-axis"><span>' +
            log.length +
            ' checks ago</span><span>Latest</span></div></section>' +
            '<section class="sec"><div class="sec__head"><h4 class="sec__title">What is synced</h4></div>' +
            SCOPES.map(function (sc) {
              var st = d.sync.stale[sc[0]];
              return (
                '<div class="scope"><span>' +
                sc[1] +
                '</span><span class="chip tone-' +
                (st ? 'warn' : 'ok') +
                '">' +
                (st ? 'Stale' : 'Up to date') +
                '</span><small>' +
                (st ? fmtAgo(st) : ls ? ago(ls) : '–') +
                '</small></div>'
              );
            }).join('') +
            '</section>' +
            '<section class="sec"><div class="sec__head"><h4 class="sec__title">Recent checks</h4></div><ul class="log">' +
            log
              .slice(-8)
              .reverse()
              .map(function (e) {
                return (
                  '<li><i class="dot tone-' +
                  (e.err ? 'danger' : 'ok') +
                  '"></i><div class="log__msg"><b>' +
                  (e.err ? 'Failed' : 'Synced') +
                  '</b>' +
                  (e.err ? esc(e.err) : 'Fingerprint, cookies and storage') +
                  '</div><div class="log__r">' +
                  ago(e.t) +
                  '<span>' +
                  (e.ms == null ? '–' : e.ms + ' ms') +
                  '</span></div></li>'
                );
              })
              .join('') +
            '</ul></section>'
          );
        }

        function kvItems(d) {
          var list = d.storage[state.kvKind],
            q = state.kvQuery.trim().toLowerCase();
          return q
            ? list.filter(function (x) {
                return x.name.toLowerCase().indexOf(q) !== -1;
              })
            : list;
        }
        function kvRow(d, x) {
          var kind = state.kvKind,
            key = d.domain + '|' + kind + '|' + x.name,
            shown = state.revealed.has(key);
          var masked = '•'.repeat(Math.min(24, Math.max(6, x.value.length)));
          var flags =
            kind === 'cookies'
              ? (x.tracker ? '<span class="chip tone-warn">Tracker</span>' : '') +
                (!x.secure ? '<span class="chip tone-danger">Not secure</span>' : '')
              : '';
          var tags =
            kind === 'cookies'
              ? (x.secure ? '<span class="tag">Secure</span>' : '') +
                (x.httpOnly ? '<span class="tag">HttpOnly</span>' : '') +
                '<span class="tag">' +
                x.sameSite +
                '</span><span class="kv__sz">' +
                (x.days ? x.days + ' days' : 'Session') +
                ', ' +
                x.size +
                ' B</span>'
              : '<span class="kv__sz">' + x.size + ' B</span>';
          return (
            '<div class="kv"><div class="kv__top"><span class="kv__name" title="' +
            esc(x.name) +
            '">' +
            esc(x.name) +
            '</span>' +
            flags +
            '<button class="icon-btn icon-btn--danger" type="button" data-act="kv-del" data-name="' +
            esc(x.name) +
            '" title="Delete" aria-label="Delete ' +
            esc(x.name) +
            '">' +
            ICON.trash +
            '</button></div>' +
            '<div class="kv__val"><code>' +
            (shown ? esc(x.value) : masked) +
            '</code><button class="icon-btn" type="button" data-act="kv-eye" data-name="' +
            esc(x.name) +
            '" title="' +
            (shown ? 'Hide value' : 'Show value') +
            '" aria-label="' +
            (shown ? 'Hide value' : 'Show value') +
            '">' +
            (shown ? ICON.eyeOff : ICON.eye) +
            '</button></div>' +
            '<div class="kv__tags">' +
            tags +
            '</div></div>'
          );
        }
        function kvListHtml(d) {
          var items = kvItems(d);
          if (!items.length) {
            var none = !d.storage[state.kvKind].length;
            var what = {
              cookies: 'cookies',
              local: 'localStorage entries',
              session: 'sessionStorage entries',
            }[state.kvKind];
            return emptyState(
              ICON.searchLg,
              'mute',
              none ? 'No ' + what : 'Nothing matches',
              none
                ? 'Nothing is stored for this domain. Entries appear here after the next visit.'
                : 'No name contains that text.',
            );
          }
          return items
            .map(function (x) {
              return kvRow(d, x);
            })
            .join('');
        }
        function viewStorage(d) {
          var c = d.storage.cookies,
            l = d.storage.local,
            s = d.storage.session;
          var trackers = c.filter(function (x) {
              return x.tracker;
            }).length,
            insecure = c.filter(function (x) {
              return !x.secure;
            }).length;
          var total = c.concat(l, s).reduce(function (n, x) {
            return n + x.size;
          }, 0);
          var segs = [
            ['cookies', 'Cookies', c.length],
            ['local', 'Local', l.length],
            ['session', 'Session', s.length],
          ];
          return (
            '<section class="sec"><div class="kv-sum"><span><b>' +
            (c.length + l.length + s.length) +
            '</b> entries</span><span><b>' +
            fmtBytes(total) +
            '</b></span>' +
            (trackers
              ? '<span class="chip tone-warn">' +
                trackers +
                (trackers === 1 ? ' tracker' : ' trackers') +
                '</span>'
              : '') +
            (insecure ? '<span class="chip tone-danger">' + insecure + ' not secure</span>' : '') +
            '</div>' +
            '<div class="kv-tools"><div class="seg" role="tablist">' +
            segs
              .map(function (x) {
                return (
                  '<button class="seg__item' +
                  (state.kvKind === x[0] ? ' is-active' : '') +
                  '" type="button" role="tab" data-act="kv-kind" data-kind="' +
                  x[0] +
                  '">' +
                  x[1] +
                  '<span class="seg__badge">' +
                  x[2] +
                  '</span></button>'
                );
              })
              .join('') +
            '</div>' +
            '<div class="field"><span class="field__icon">' +
            ICON.search +
            '</span><input class="field__input" style="height:30px" type="text" placeholder="Search names" value="' +
            esc(state.kvQuery) +
            '" data-kv-search autocomplete="off" spellcheck="false" /></div></div></section>' +
            '<div id="kv-list">' +
            kvListHtml(d) +
            '</div>'
          );
        }

        function alertCard(a) {
          var closed = a.status !== 'open';
          var typeLabel = {
            ip: 'IP',
            fp: 'Fingerprint',
            sync: 'Sync',
            storage: 'Storage',
          }[a.type];
          var statusLabel = {
            dismissed: 'Dismissed',
            expected: 'Marked as expected',
            resolved: 'Resolved',
          }[a.status];
          return (
            '<div class="alert' +
            (closed ? ' is-closed' : '') +
            '"><div class="alert__top">' +
            (closed
              ? '<span class="chip tone-mute">' + statusLabel + '</span>'
              : '<span class="chip tone-' +
                sevTone(a.sev) +
                '"><i class="dot"></i>' +
                cap(a.sev) +
                '</span>') +
            '<span class="tag">' +
            typeLabel +
            '</span><span class="alert__time">' +
            ago(a.t) +
            '</span></div>' +
            '<div class="alert__title">' +
            esc(a.title) +
            '</div><p class="alert__detail">' +
            esc(a.detail) +
            '</p>' +
            '<div class="alert__acts">' +
            (closed
              ? a.status === 'resolved'
                ? ''
                : '<button class="btn-mini" type="button" data-act="reopen" data-id="' +
                  a.id +
                  '">Reopen</button>'
              : '<button class="btn-mini" type="button" data-act="dismiss" data-id="' +
                a.id +
                '">Dismiss</button><button class="btn-mini" type="button" data-act="expected" data-id="' +
                a.id +
                '">Mark as expected</button>') +
            '</div></div>'
          );
        }
        function viewAlerts(d) {
          var open = openAlerts(d).sort(function (a, b) {
            return W[b.sev] - W[a.sev] || b.t - a.t;
          });
          var closed = d.alerts.filter(function (a) {
            return a.status !== 'open';
          });
          return (
            (open.length
              ? open.map(alertCard).join('')
              : emptyState(
                  ICON.shield,
                  'ok',
                  'No open alerts',
                  'This domain looks consistent. New alerts appear here when its IP, fingerprint or sync behaviour changes.',
                )) +
            (closed.length
              ? '<div class="list-head">Closed (' +
                closed.length +
                ')</div>' +
                closed.map(alertCard).join('')
              : '')
          );
        }

        var VIEWS = {
          overview: viewOverview,
          ip: viewIp,
          fp: viewFp,
          sync: viewSync,
          storage: viewStorage,
          alerts: viewAlerts,
        };

        // ---------------- modal events ----------------
        function onAct(e) {
          var t = e.target.closest('[data-act]');
          if (!t || t.disabled) return;
          var d = byName(state.open);
          if (!d) return;
          var act = t.getAttribute('data-act'),
            id = t.getAttribute('data-id');
          function setAlert(status, msg) {
            var a = d.alerts.find(function (x) {
              return x.id === id;
            });
            if (!a) return;
            a.status = status;
            toast(msg);
            renderAll();
          }
          switch (act) {
            case 'goto':
              state.tab = t.getAttribute('data-tab');
              renderModal(true);
              break;
            case 'sync-now':
              resyncMany([d.domain]);
              break;
            case 'export':
              e.stopPropagation();
              openExportMenu(t, [d.domain]);
              break;
            case 'clear':
              askClear([d.domain]);
              break;
            case 'forget':
              askForget([d.domain]);
              break;
            case 'dismiss':
              setAlert('dismissed', 'Alert dismissed');
              break;
            case 'expected':
              setAlert('expected', 'Marked as expected');
              break;
            case 'reopen':
              setAlert('open', 'Alert reopened');
              break;
            case 'toggle-same':
              state.showSame = !state.showSame;
              renderModal(false);
              break;
            case 'kv-kind':
              state.kvKind = t.getAttribute('data-kind');
              state.kvQuery = '';
              renderModal(false);
              break;
            case 'kv-eye': {
              var key = d.domain + '|' + state.kvKind + '|' + t.getAttribute('data-name');
              if (state.revealed.has(key)) state.revealed['delete'](key);
              else state.revealed.add(key);
              $('#kv-list').innerHTML = kvListHtml(d);
              break;
            }
            case 'kv-del': {
              var nm = t.getAttribute('data-name'),
                arr = d.storage[state.kvKind];
              var i = arr.findIndex(function (x) {
                return x.name === nm;
              });
              if (i !== -1) arr.splice(i, 1);
              toast('Deleted ' + nm);
              renderModal(false);
              break;
            }
          }
        }
        el.mBody.addEventListener('click', onAct);
        el.mFoot.addEventListener('click', onAct);
        el.mBody.addEventListener('change', function (e) {
          var k = e.target.getAttribute && e.target.getAttribute('data-cmp');
          if (!k || !state.cmp) return;
          state.cmp[k] = Number(e.target.value);
          renderModal(false);
        });
        el.mBody.addEventListener('input', function (e) {
          if (e.target.hasAttribute && e.target.hasAttribute('data-kv-search')) {
            state.kvQuery = e.target.value;
            var d = byName(state.open);
            if (d) $('#kv-list').innerHTML = kvListHtml(d);
          }
        });

        // ---------------- global keys ----------------
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return;
          if (openPop) return closePop();
          if (el.dlg.classList.contains('is-open')) return closeDlg();
          if (state.open) closeModal();
        });

        // ---------------- boot ----------------
        function load() {
          state.status = 'loading';
          renderAll();
          setTimeout(function () {
            state.status = 'ready';
            renderAll();
          }, 700);
        }
        load();
      })();
    </script>
  </body>
</html>
