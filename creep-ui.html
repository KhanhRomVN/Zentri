<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGNAL // Fingerprint Inspector</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <style>
      @import url('https://cdnjs.cloudflare.com/ajax/libs/JetBrains-Mono/2.304/css/jetbrains-mono.min.css');

      :root {
        --bg: #05080a;
        --bg-raised: #0a0f13;
        --panel: #0c1218;
        --panel-2: #0f161c;
        --border: #1a242c;
        --border-soft: #141c22;
        --text: #c7d4da;
        --text-dim: #5f7480;
        --text-dimmer: #3d4c54;
        --accent: #35e39a;
        --accent-dim: #1c6e4c;
        --accent-glow: rgba(53, 227, 154, 0.14);
        --info: #4fb3ff;
        --warn: #ffb454;
        --danger: #ff5c72;
        --danger-glow: rgba(255, 92, 114, 0.12);
        --radius: 3px;
        --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        background-image:
          radial-gradient(circle at 15% 0%, var(--accent-glow), transparent 40%),
          radial-gradient(circle at 85% 100%, rgba(79, 179, 255, 0.04), transparent 45%);
        overflow-x: hidden;
      }

      ::selection {
        background: var(--accent-glow);
        color: var(--accent);
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-dimmer);
      }

      a,
      button,
      input,
      select {
        font-family: inherit;
      }

      /* ===== LAYOUT ===== */
      .app {
        display: grid;
        grid-template-columns: 250px 1fr;
        grid-template-rows: 52px auto 1fr;
        height: 100vh;
      }

      /* ===== TOPBAR ===== */
      .topbar {
        grid-column: 1/3;
        grid-row: 1;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 18px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, var(--bg-raised), var(--bg));
        position: relative;
        z-index: 25;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        white-space: nowrap;
      }
      .brand .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      .brand b {
        letter-spacing: 2.5px;
        font-size: 13px;
        font-weight: 700;
      }
      .brand span {
        color: var(--text-dim);
        font-size: 11px;
      }

      .topbar-search {
        flex: 1;
        max-width: 400px;
        position: relative;
      }
      .topbar-search input {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 7px 10px 7px 28px;
        border-radius: var(--radius);
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s;
      }
      .topbar-search input:focus {
        border-color: var(--accent-dim);
      }
      .topbar-search::before {
        content: '⌕';
        position: absolute;
        left: 9px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        font-size: 14px;
      }

      .topbar-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hash-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 5px 10px;
        border-radius: var(--radius);
        font-size: 11px;
        color: var(--text-dim);
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .hash-chip:hover {
        border-color: var(--accent-dim);
        color: var(--accent);
      }
      .hash-chip b {
        color: var(--text);
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .btn {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 12px;
        border-radius: var(--radius);
        font-size: 11px;
        cursor: pointer;
        letter-spacing: 0.4px;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s;
      }
      .btn:hover {
        border-color: var(--accent-dim);
        color: var(--accent);
        background: var(--accent-glow);
      }
      .btn.primary {
        background: var(--accent);
        color: #04140c;
        border-color: var(--accent);
        font-weight: 700;
      }
      .btn.primary:hover {
        background: var(--accent);
        filter: brightness(1.12);
        color: #04140c;
      }
      .btn.ghost-danger:hover {
        border-color: var(--danger);
        color: var(--danger);
        background: var(--danger-glow);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn:disabled:hover {
        border-color: var(--border);
        color: var(--text);
        background: var(--panel);
      }

      /* ===== ALERT BANNER ===== */
      .alert-banner {
        grid-column: 1/3;
        grid-row: 2;
        display: none;
        align-items: center;
        gap: 12px;
        padding: 9px 18px;
        font-size: 12px;
        border-bottom: 1px solid var(--border);
        background: var(--danger-glow);
        color: var(--danger);
      }
      .alert-banner.show {
        display: flex;
      }
      .alert-banner.sev-high {
        background: rgba(255, 180, 84, 0.12);
        color: var(--warn);
      }
      .alert-banner .ic {
        font-size: 15px;
      }
      .alert-banner .msg {
        flex: 1;
      }
      .alert-banner .msg b {
        font-weight: 700;
      }
      .alert-banner button {
        background: transparent;
        border: 1px solid currentColor;
        color: inherit;
        padding: 4px 10px;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 10.5px;
      }

      /* ===== SIDEBAR ===== */
      .sidebar {
        grid-column: 1;
        grid-row: 3;
        border-right: 1px solid var(--border);
        background: var(--bg-raised);
        overflow-y: auto;
        padding: 14px 0 20px;
      }
      .sb-group-label {
        font-size: 10px;
        color: var(--text-dimmer);
        letter-spacing: 1.6px;
        padding: 14px 18px 6px;
        text-transform: uppercase;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 18px;
        cursor: pointer;
        color: var(--text-dim);
        border-left: 2px solid transparent;
        font-size: 12.5px;
        position: relative;
        transition: all 0.12s;
      }
      .nav-item:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.02);
      }
      .nav-item.active {
        color: var(--accent);
        border-left-color: var(--accent);
        background: var(--accent-glow);
      }
      .nav-item .ic {
        width: 14px;
        text-align: center;
        opacity: 0.85;
        font-size: 13px;
      }
      .nav-item .flag {
        margin-left: auto;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-dimmer);
      }
      .nav-item .flag.warn {
        background: var(--warn);
        box-shadow: 0 0 5px var(--warn);
      }
      .nav-item .flag.ok {
        background: var(--accent);
        box-shadow: 0 0 5px var(--accent);
      }
      .nav-item .flag.bad {
        background: var(--danger);
        box-shadow: 0 0 5px var(--danger);
      }

      /* ===== MAIN ===== */
      .main {
        grid-column: 2;
        grid-row: 3;
        overflow-y: auto;
        padding: 22px 26px 60px;
      }
      .view {
        display: none;
        animation: fadein 0.25s ease;
      }
      .view.active {
        display: block;
      }
      @keyframes fadein {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .page-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .page-head h1 {
        font-size: 16px;
        letter-spacing: 0.5px;
        font-weight: 600;
      }
      .page-head .sub {
        color: var(--text-dim);
        font-size: 11.5px;
        margin-top: 3px;
      }
      .page-head .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ===== GRID / CARDS ===== */
      .grid {
        display: grid;
        gap: 14px;
      }
      .grid.cols-4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .grid.cols-3 {
        grid-template-columns: 2fr 1fr 1fr;
      }
      .grid.cols-2 {
        grid-template-columns: 1.3fr 1fr;
      }
      @media (max-width: 1100px) {
        .grid.cols-4 {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid.cols-3 {
          grid-template-columns: 1fr;
        }
        .grid.cols-2 {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      .card-title {
        font-size: 10.5px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .card-title .tt {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .card-title .tag {
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 2px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text-dim);
        text-transform: none;
        letter-spacing: 0.3px;
      }

      .stat-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .stat-card .label {
        font-size: 10.5px;
        color: var(--text-dim);
        letter-spacing: 1px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat-card .value {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .stat-card .value.ok {
        color: var(--accent);
      }
      .stat-card .value.warn {
        color: var(--warn);
      }
      .stat-card .value.bad {
        color: var(--danger);
      }
      .stat-card .delta {
        font-size: 11px;
        color: var(--text-dim);
      }

      .gauge-wrap {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .gauge {
        position: relative;
        width: 132px;
        height: 132px;
        flex: none;
      }
      .gauge svg circle:nth-child(2) {
        transition:
          stroke-dashoffset 1s cubic-bezier(0.16, 0.8, 0.3, 1),
          stroke 0.3s;
      }
      .gauge-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .gauge-center b {
        font-size: 26px;
      }
      .gauge-center span {
        font-size: 9.5px;
        color: var(--text-dim);
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .gauge-legend {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .gauge-legend .row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        color: var(--text-dim);
      }
      .gauge-legend .row b {
        color: var(--text);
        font-weight: 500;
      }
      .verdict {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: var(--radius);
        background: var(--accent-glow);
        border: 1px solid var(--accent-dim);
        font-size: 11px;
        color: var(--accent);
      }
      .verdict.warn {
        background: rgba(255, 180, 84, 0.1);
        border-color: #8a5a1c;
        color: var(--warn);
      }
      .verdict.bad {
        background: var(--danger-glow);
        border-color: #7a1f2c;
        color: var(--danger);
      }

      .bar-row {
        display: grid;
        grid-template-columns: 130px 1fr 40px;
        align-items: center;
        gap: 10px;
        margin-bottom: 11px;
        font-size: 11.5px;
      }
      .bar-row:last-child {
        margin-bottom: 0;
      }
      .bar-row .lbl {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .bar-track {
        height: 6px;
        background: var(--panel-2);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--accent-dim), var(--accent));
        width: 0;
        transition: width 1s cubic-bezier(0.16, 0.8, 0.3, 1);
      }
      .bar-fill.warn {
        background: linear-gradient(90deg, #8a5a1c, var(--warn));
      }
      .bar-fill.bad {
        background: linear-gradient(90deg, #7a1f2c, var(--danger));
      }
      .bar-val {
        text-align: right;
        color: var(--text-dim);
      }

      .log {
        background: #040606;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        font-size: 11.5px;
        max-height: 260px;
        overflow-y: auto;
      }
      .log .line {
        display: flex;
        gap: 8px;
        padding: 3px 0;
        color: var(--text-dim);
      }
      .log .line .t {
        color: var(--text-dimmer);
        flex: none;
      }
      .log .line .tag {
        flex: none;
        font-weight: 700;
      }
      .log .line.ok .tag {
        color: var(--accent);
      }
      .log .line.warn .tag {
        color: var(--warn);
      }
      .log .line.bad .tag {
        color: var(--danger);
      }
      .log .line .msg {
        color: var(--text);
      }
      .log .empty {
        color: var(--text-dimmer);
        padding: 8px 0;
      }

      .kv-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11.5px;
      }
      .kv-table tr {
        border-bottom: 1px solid var(--border-soft);
      }
      .kv-table tr:last-child {
        border-bottom: none;
      }
      .kv-table td {
        padding: 7px 4px;
        vertical-align: top;
      }
      .kv-table td.k {
        color: var(--text-dim);
        width: 42%;
        white-space: nowrap;
        display: table-cell;
      }
      .kv-table td.k .kk {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .kv-table td.v {
        color: var(--text);
        word-break: break-all;
      }
      .kv-table td.v .bool-true {
        color: var(--accent);
      }
      .kv-table td.v .bool-false {
        color: var(--danger);
      }
      .kv-table td.v .num {
        color: var(--info);
      }
      .kv-table td.v .str {
        color: var(--text);
      }

      .chip {
        display: inline-block;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 10.5px;
        margin: 2px 4px 2px 0;
      }
      .chip.sev-critical {
        border-color: var(--danger);
        color: var(--danger);
      }
      .chip.sev-high {
        border-color: var(--warn);
        color: var(--warn);
      }
      .chip.sev-medium {
        border-color: #d29922;
        color: #d29922;
      }
      .chip.sev-low {
        border-color: var(--info);
        color: var(--info);
      }
      .chip.sev-info {
        border-color: var(--text-dimmer);
        color: var(--text-dim);
      }
      .chip.clickable {
        cursor: pointer;
        user-select: none;
      }
      .chip.clickable.active {
        background: currentColor;
      }
      .chip.clickable.active.sev-critical {
        color: #fff;
        background: var(--danger);
      }
      .chip.clickable.active.sev-high {
        color: #1c1200;
        background: var(--warn);
      }
      .chip.clickable.active.sev-medium {
        color: #1c1200;
        background: #d29922;
      }
      .chip.clickable.active.sev-low {
        color: #04141f;
        background: var(--info);
      }
      .chip.clickable.active.sev-info {
        color: #0a1114;
        background: var(--text-dim);
      }

      .badge {
        font-size: 9.5px;
        padding: 2px 8px;
        border-radius: 999px;
        font-weight: 700;
        white-space: nowrap;
        letter-spacing: 0.3px;
      }
      .badge-critical {
        background: var(--danger);
        color: #fff;
      }
      .badge-high {
        background: var(--warn);
        color: #1c1200;
      }
      .badge-medium {
        background: #d29922;
        color: #1c1200;
      }
      .badge-low {
        background: var(--info);
        color: #04141f;
      }
      .badge-info {
        background: var(--text-dimmer);
        color: #c7d4da;
      }
      .badge-good {
        background: var(--accent);
        color: #04140c;
      }

      .tree {
        font-size: 11.5px;
      }
      .tree .node {
        margin-left: 16px;
      }
      .tree .row {
        display: flex;
        gap: 6px;
        padding: 2px 0;
        cursor: default;
        align-items: flex-start;
      }
      .tree .key {
        color: var(--text-dim);
        flex: none;
      }
      .tree .toggler {
        cursor: pointer;
        color: var(--text-dimmer);
        width: 12px;
        flex: none;
        user-select: none;
      }
      .tree .toggler:hover {
        color: var(--accent);
      }
      .tree .val-str {
        color: #9fd6a9;
      }
      .tree .val-num {
        color: var(--info);
      }
      .tree .val-bool-true {
        color: var(--accent);
        font-weight: 600;
      }
      .tree .val-bool-false {
        color: var(--danger);
        font-weight: 600;
      }
      .tree .val-empty {
        color: var(--text-dimmer);
        font-style: italic;
      }
      .tree .meta {
        color: var(--text-dimmer);
      }
      mark {
        background: var(--accent-glow);
        color: var(--accent);
        border-radius: 2px;
        padding: 0 2px;
      }

      .section-heading {
        font-size: 11px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin: 24px 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border-soft);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .section-heading:first-child {
        margin-top: 0;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 900px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }

      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
        background: var(--panel);
        border: 1px solid var(--accent-dim);
        color: var(--accent);
        padding: 9px 16px;
        border-radius: var(--radius);
        font-size: 11.5px;
        transition: all 0.25s;
        pointer-events: none;
        z-index: 200;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .empty-hint {
        color: var(--text-dimmer);
        font-size: 11px;
        padding: 20px 0;
        text-align: center;
      }

      /* ===== QMARK TOOLTIP ===== */
      .qmark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid var(--text-dimmer);
        color: var(--text-dimmer);
        font-size: 9px;
        font-weight: 700;
        cursor: help;
        flex: none;
        transition: all 0.15s;
        line-height: 1;
      }
      .qmark:hover,
      .qmark:focus {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-glow);
        outline: none;
      }
      body.tips-off .qmark {
        display: none;
      }
      .tooltip-pop {
        position: fixed;
        z-index: 500;
        max-width: 320px;
        background: #040a08;
        border: 1px solid var(--accent-dim);
        border-radius: 6px;
        padding: 11px 13px;
        font-size: 11.5px;
        line-height: 1.55;
        color: var(--text);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
        opacity: 0;
        visibility: hidden;
        transform: translateY(4px);
        transition:
          opacity 0.12s,
          transform 0.12s;
        pointer-events: none;
      }
      .tooltip-pop.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .tooltip-pop .tip-title {
        color: var(--accent);
        font-weight: 700;
        font-size: 10.5px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .tooltip-pop .tip-body {

      }

      /* ===== SETTINGS ===== */
      .setting-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid var(--border-soft);
      }
      .setting-row:last-child {
        border-bottom: none;
      }
      .setting-copy {
        max-width: 520px;
      }
      .setting-copy .t {
        font-size: 12.5px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-weight: 600;
      }
      .setting-copy .d {
        font-size: 11.5px;
        color: var(--text-dim);
      }
      .setting-control {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toggle {
        position: relative;
        width: 38px;
        height: 20px;
        flex: none;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }
      .toggle .track {
        position: absolute;
        inset: 0;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 20px;
        cursor: pointer;
        transition: 0.2s;
      }
      .toggle .track::before {
        content: '';
        position: absolute;
        width: 14px;
        height: 14px;
        left: 2px;
        top: 1px;
        background: var(--text-dimmer);
        border-radius: 50%;
        transition: 0.2s;
      }
      .toggle input:checked + .track {
        background: var(--accent-glow);
        border-color: var(--accent-dim);
      }
      .toggle input:checked + .track::before {
        background: var(--accent);
        transform: translateX(17px);
        box-shadow: 0 0 6px var(--accent);
      }

      .select-ctl {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 9px;
        border-radius: var(--radius);
        font-size: 11.5px;
      }

      .accent-swatches {
        display: flex;
        gap: 8px;
      }
      .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: 0.15s;
        position: relative;
      }
      .swatch.active {
        border-color: var(--text);
        box-shadow:
          0 0 0 2px var(--bg),
          0 0 0 3px currentColor;
      }

      .scenario-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .monitor-field-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--border-soft);
        font-size: 11.5px;
        gap: 10px;
      }
      .monitor-field-row:last-child {
        border-bottom: none;
      }
      .monitor-field-row .fname {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-dim);
      }
      .monitor-field-row .fval {
        color: var(--text);
        word-break: break-all;
        text-align: right;
      }
      .monitor-field-row.changed {
        background: rgba(255, 92, 114, 0.06);
        border-radius: 4px;
        padding-left: 6px;
        padding-right: 6px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--text-dim);
      }
      .status-pill .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-dimmer);
      }
      .status-pill.live .dot {
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .status-pill.live {
        color: var(--accent);
        border-color: var(--accent-dim);
      }

      .menu-btn {
        display: none;
      }
      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: fixed;
          left: 0;
          top: 52px;
          bottom: 0;
          width: 230px;
          transform: translateX(-100%);
          transition: transform 0.2s;
          z-index: 30;
        }
        .sidebar.open {
          transform: translateX(0);

        }

          grid-column: 1;
        }
        .menu-btn {
          display: flex;
        }
        .topbar-search {

        }

          grid-column: 1;
        }
      }

  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <button class="btn menu-btn" id="menuBtn">☰</button>
        <div class="brand">
          <span class="dot"></span><b>SIGNAL</b><span>/ fingerprint inspector</span>
        </div>
        <div class="topbar-search">
          <input
            id="searchInput"
            placeholder="Search any key or value... (e.g. canvas, timezone, webdriver)"
          />
        </div>
        <div class="topbar-right">
          <span class="status-pill" id="monitorStatusPill"
            ><span class="dot"></span><span>Monitor idle</span></span
          >
          <div class="hash-chip" id="hashChip" title="Copy fingerprint ID">
            ID <b>7c1e9a2f4b8d3160</b>
          </div>
          <button class="btn" id="exportBtn">⭳ Export report</button>
          <button class="btn primary" id="rescanBtn">↻ Re-run scan</button>
        </div>
      </div>

      <div class="alert-banner" id="alertBanner">
        <span class="ic">⚑</span>
        <span class="msg" id="alertBannerMsg"></span>
        <button id="alertBannerView">View details</button>
        <button id="alertBannerDismiss">Dismiss</button>
      </div>

      <div class="sidebar" id="sidebar"></div>
      <div class="main" id="main"></div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="tooltip-pop" id="tooltipPop">
      <div class="tip-title" id="tipTitle"></div>
      <div class="tip-body" id="tipBody"></div>
    </div>

    <!-- Load creep.js (phải để trước script chính) -->
    <script src="./creepjs/docs/creep.js"></script>

    <script>
      /* ============================================================================================
         0. ĐỢI CREEP.JS LOAD XONG, LẤY DỮ LIỆU THẬT
         ============================================================================================ */
      let DATA = null;
      let CREEP = null;

      function waitForCreep(callback) {
        if (window.Fingerprint && window.Creep) {
          callback(window.Fingerprint, window.Creep);
        } else {
          setTimeout(() => waitForCreep(callback), 200);
        }
      }

      function buildMetaFromFingerprint(fp) {
        // Lấy fingerprintId từ hash của navigator hoặc từ chính fingerprint
        const id = fp.navigator?.$hash || fp.$hash || 'unknown';
        // Lấy lies từ fp.lies.data (nếu có)
        const liesData = fp.lies?.data || {};
        const liesArray = Object.keys(liesData).map((key) => ({
          property: key,
          type: 'inconsistent_read',
          expected: 'consistent',
          actual: liesData[key],
        }));
        // Tạo log từ các trạng thái
        const log = [];
        log.push({
          t: new Date().toLocaleTimeString(),
          tag: '[BOOT]',
          msg: 'Creep.js loaded',
          tone: 'ok',
        });
        if (fp.headless) {
          const hr = fp.headless.headlessRating || 0;
          if (hr > 0)
            log.push({
              t: new Date().toLocaleTimeString(),
              tag: '[WARN]',
              msg: `Headless rating ${hr}%`,
              tone: 'warn',
            });
          else
            log.push({
              t: new Date().toLocaleTimeString(),
              tag: '[OK]',
              msg: 'No headless indicators',
              tone: 'ok',
            });
        }
        if (fp.canvas2d) {
          log.push({
            t: new Date().toLocaleTimeString(),
            tag: '[OK]',
            msg: `Canvas2D hash: ${fp.canvas2d.$hash?.slice(0, 8) || 'n/a'}`,
            tone: 'ok',
          });
        }
        if (fp.canvasWebgl) {
          const gpu = fp.canvasWebgl.gpu || {};
          if (gpu.grade === 'A')
            log.push({
              t: new Date().toLocaleTimeString(),
              tag: '[OK]',
              msg: `WebGL GPU grade ${gpu.grade}`,
              tone: 'ok',
            });
          else
            log.push({
              t: new Date().toLocaleTimeString(),
              tag: '[WARN]',
              msg: `WebGL GPU grade ${gpu.grade}`,
              tone: 'warn',
            });
        }
        log.push({
          t: new Date().toLocaleTimeString(),
          tag: '[DONE]',
          msg: 'Deep scan complete',
          tone: 'ok',
        });
        return {
          fingerprintId: id,
          scannedAt: new Date().toISOString(),
          log,
          lies: liesArray,
        };
      }

      function initData() {
        waitForCreep((fp, creep) => {
          CREEP = creep;
          const meta = buildMetaFromFingerprint(fp);
          // Gộp fingerprint và meta
          DATA = { ...fp, meta };
          // Cập nhật hash chip
          document.querySelector('.hash-chip b').textContent = meta.fingerprintId;
          // Bắt đầu render
          report = buildReport(DATA);
          renderSidebar();
          renderMain();
          applySettingsSideEffects();
          // Bắt đầu monitor với baseline
          Monitor.captureBaseline();
          toast('Creep.js data loaded');
        });
      }

      /* ============================================================================================
         1. SCENARIO SIMULATOR — giữ nguyên để demo nhưng dùng dữ liệu thật
         ============================================================================================ */
      const SCENARIOS = {
        clean: { label: 'Clean baseline (default)', apply: (d) => d },
        automation: {
          label: 'Automation flags exposed',
          apply: (d) => {
            if (!d.headless) d.headless = {};
            if (!d.headless.headless) d.headless.headless = {};
            d.headless.headless.webDriverIsOn = true;
            d.headless.headlessRating = 81;
            if (!d.headless.likeHeadless) d.headless.likeHeadless = {};
            d.headless.likeHeadless.uaDataIsBlank = true;
            if (!d.meta) d.meta = { lies: [] };
            d.meta.lies.push({
              property: 'navigator.webdriver',
              type: 'hard_flag',
              expected: 'false / undefined',
              actual: 'true',
            });
            d.meta.log.push({
              t: 'live',
              tag: '[BAD]',
              msg: 'navigator.webdriver now resolves to true',
              tone: 'bad',
            });
            return d;
          },
        },
        stealth: {
          label: 'Stealth-patch fingerprints',
          apply: (d) => {
            if (!d.headless) d.headless = {};
            if (!d.headless.stealth) d.headless.stealth = {};
            d.headless.stealth.hasToStringProxy = true;
            d.headless.stealth.hasIframeProxy = true;
            d.headless.stealthRating = 64;
            d.meta.log.push({
              t: 'live',
              tag: '[BAD]',
              msg: 'Function.prototype.toString() returns a proxied result',
              tone: 'bad',
            });
            return d;
          },
        },
        gpuspoof: {
          label: 'GPU spoofing (software renderer)',
          apply: (d) => {
            if (!d.canvasWebgl) d.canvasWebgl = { parameters: {}, gpu: {} };
            if (!d.canvasWebgl.parameters) d.canvasWebgl.parameters = {};
            d.canvasWebgl.parameters.UNMASKED_RENDERER_WEBGL =
              'Google SwiftShader (D3D11 llvmpipe)';
            d.canvasWebgl.parameters.UNMASKED_VENDOR_WEBGL = 'Google Inc.';
            d.canvasWebgl.gpu.confidence = 21;
            d.canvasWebgl.gpu.grade = 'D';
            d.canvasWebgl.gpu.warnings = [
              'Reported renderer does not match a known discrete-GPU signature and behaves like a software rasterizer.',
            ];
            if (!d.headless) d.headless = {};
            if (!d.headless.likeHeadless) d.headless.likeHeadless = {};
            d.headless.likeHeadless.hasSwiftShader = true;
            d.meta.log.push({
              t: 'live',
              tag: '[BAD]',
              msg: 'WebGL renderer string now reports SwiftShader',
              tone: 'bad',
            });
            return d;
          },
        },
        timezonedrift: {
          label: 'Timezone / locale drift',
          apply: (d) => {
            if (!d.timezone) d.timezone = {};
            d.timezone.offsetComputed = -60;
            if (!d.intl) d.intl = {};
            d.intl.locale = 'fr-FR';
            d.meta.log.push({
              t: 'live',
              tag: '[WARN]',
              msg: 'Measured UTC offset no longer matches the declared IANA zone',
              tone: 'warn',
            });
            return d;
          },
        },
      };
      let currentScenario = 'clean';
      function applyScenario(name) {
        currentScenario = name;
        // Lấy fingerprint gốc (deep clone)
        const base = JSON.parse(JSON.stringify(window.Fingerprint));
        const meta = buildMetaFromFingerprint(base);
        DATA = { ...base, meta };
        DATA = SCENARIOS[name].apply(DATA);
        rebuildAndRender();
        toast('Scenario applied: ' + SCENARIOS[name].label);
      }

      /* ============================================================================================
         2. TOOLTIP CONTENT (giữ nguyên)
         ============================================================================================ */
      const TOOLTIPS = {
        'overview.trustScore': {
          title: 'Composite Trust Score',
          body: 'A single 0-100 figure summarizing every signal collected during the deep scan. It is not a flat average: each data category is weighted by how diagnostic it typically is for bot/automation detection (Headless heuristics and API tampering carry more weight than, say, font enumeration), and any single confirmed critical tell — such as navigator.webdriver reporting true — hard-caps the overall figure regardless of how clean everything else looks, because real anti-bot systems usually act the same way.',
        },
        'overview.headlessConfidence': {
          title: 'Headless / Automation Confidence',
          body: 'An independent probability estimate that this session is running under browser automation (Selenium, Puppeteer, Playwright, or a similar driver) or behind a stealth-patch library. It is computed with a Bayesian-style combination of all weak and strong signals — 1 minus the product of "probability this signal is innocent" across every fired indicator — rather than simply adding percentages together, so a handful of unrelated weak signals cannot mathematically exceed 100% the way naive addition would.',
        },
        'overview.categoryRisk': {

        'overview.deepScanLog': {

        },
        'overview.liesPreview': {
          title: 'Confirmed Lies',
          body: 'A "lie" is a stronger claim than an ordinary conflict: it means the same property was read more than once, or cross-checked against a related API, and the values are logically incompatible with a single honest, unmodified browser — for example a permission reported as `prompt` while `Notification.permission` simultaneously reports `denied`. Because lies require an internal contradiction rather than just an unusual value, they are treated as critical-severity by default.',
        },
        'nav.system': {
          title: 'Operating System',
          body: 'The OS string as inferred from a combination of the legacy User-Agent, the modern User-Agent Client Hints API, and platform-specific API surface (e.g. presence of `chrome.webstore`, touch/pointer behavior). Spoofing tools frequently update the User-Agent string but forget to keep every one of these secondary signals internally consistent with each other.',

        'nav.language': {
          title: 'Primary Language',

        'nav.languages': {
          title: 'Language Preference List',

        'screen.touch': {

        'screen.systemColors': {
          title: 'CSS System Colors / Fonts',

        },
        'headless.ratingHeadless': {
          title: 'Headless Rating',
          body: 'A 0-100% score focused specifically on hard, unambiguous automation tells (webdriver flag, headless-specific User-Agent tokens, headless worker context). A nonzero value here is rare in genuine human browsing and should be treated as strong evidence on its own.',
        },
        'headless.ratingLikeHeadless': {
          title: 'Like-Headless Rating',
          body: 'A 0-100% score built from a broader basket of soft signals that correlate with headless/automated environments but can each individually occur in a normal browser for unrelated reasons (an empty plugin list because the user disabled PDF viewing, for instance). It is meant to be read alongside — never instead of — the harder Headless and Stealth ratings.',
        },
        'headless.ratingStealth': {
          title: 'Stealth-Patch Rating',
          body: 'A 0-100% score for evidence that a stealth/anti-detect library (such as puppeteer-extra-plugin-stealth or similar) has been used to actively hide automation — for example by proxying `Function.prototype.toString` so patched functions still print native-looking source. Ironically, the presence of the patch itself is usually easier to detect than the thing it was trying to hide.',
        },
        'headless.hardFlags': {
          title: 'Hard Automation Flags',
          body: 'Direct, unambiguous automation indicators read straight from the environment: `navigator.webdriver === true`, a User-Agent containing the literal word "Headless", or a Web Worker context reporting the same. Any one of these being true is close to conclusive on its own and is always scored as critical severity.',
        },
        'headless.stealthFlags': {
          title: 'Stealth-Patch Artifacts',
          body: 'Side-effects left behind by libraries that try to erase the hard flags above — for instance an iframe-based proxy trick used to fake property descriptors, or a `chrome.runtime` object patched into a shape that does not quite match a real Chrome install. These are treated as high severity: their presence implies active, deliberate concealment rather than an accidental configuration quirk.',

      };
      function tipHtml(id) {
        return TOOLTIPS[id] ? ` <span class="qmark" data-tip-id="${id}" tabindex="0">?</span>` : '';
      }

      /* ============================================================================================
         3. GENERIC RENDER HELPERS
         ============================================================================================ */
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function fmtVal(v) {
        if (v === true) return `<span class="bool-true">true</span>`;
        if (v === false) return `<span class="bool-false">false</span>`;
        if (typeof v === 'number') return `<span class="num">${v}</span>`;
        return `<span class="str">${escapeHtml(v)}</span>`;
      }
      function kvTable(obj, opts) {
        opts = opts || {};
        const skip = opts.skip || [];
        const tipPrefix = opts.tipPrefix || null;
        let rows = '';
        for (const [k, v] of Object.entries(obj)) {
          if (skip.includes(k)) continue;
          if (v === null || v === undefined) continue;
          let display;
          if (Array.isArray(v)) {
            display = v
              .map(
                (x) =>
                  `<span class="chip">${escapeHtml(typeof x === 'object' ? JSON.stringify(x) : x)}</span>`,
              )
              .join(' ');
          } else if (typeof v === 'object') {
            display = Object.entries(v)
              .slice(0, 8)
              .map(
                ([kk, vv]) =>
                  `<span class="chip">${escapeHtml(kk)}: ${escapeHtml(typeof vv === 'object' ? JSON.stringify(vv) : vv)}</span>`,
              )
              .join(' ');
          } else {
            display = fmtVal(v);
          }
          const tipId = tipPrefix ? `${tipPrefix}.${k}` : null;
          const q = tipId ? tipHtml(tipId) : '';
          rows += `<tr><td class="k"><span class="kk">${escapeHtml(k)}${q}</span></td><td class="v">${display}</td></tr>`;
        }
        return `<table class="kv-table">${rows}</table>`;
      }
      function hashPill(hash) {
        return `<span class="hash-chip" style="display:inline-flex" onclick="copyText('${hash}')">HASH <b>${hash}</b></span>`;
      }

        t.textContent = msg;
        t.classList.add('show');

        window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);

      function copyText(txt) {
        navigator.clipboard?.writeText(txt).catch(() => {});
        toast('Copied: ' + txt);
      }
      window.copyText = copyText;

      function renderTree(obj, keyName) {
        const type = Array.isArray(obj) ? 'array' : typeof obj;
        if (obj === null || obj === undefined || obj === '') {
          return `<div class="row"><span class="toggler"> </span><span class="key">${escapeHtml(keyName)}:</span><span class="val-empty">empty</span></div>`;
        }
        if (type === 'object' || type === 'array') {
          const entries = type === 'array' ? obj.map((v, i) => [i, v]) : Object.entries(obj);
          const count = entries.length;
          const id = 'n' + Math.random().toString(36).slice(2, 9);
          const inner = entries
            .map(([k, v]) => `<div class="node">${renderTree(v, k)}</div>`)
            .join('');
          return `<div class="tree-node" data-node>
            <div class="row"><span class="toggler" data-toggle="${id}">▾</span><span class="key">${escapeHtml(keyName)}</span><span class="meta">${type === 'array' ? `[${count}]` : `{${count}}`}</span></div>
            <div id="${id}">${inner}</div>
          </div>`;
        }
        let valHtml;
        if (type === 'boolean') valHtml = `<span class="val-bool-${obj}">${obj}</span>`;
        else if (type === 'number') valHtml = `<span class="val-num">${obj}</span>`;
        else valHtml = `<span class="val-str">"${escapeHtml(obj)}"</span>`;
        return `<div class="row"><span class="toggler"> </span><span class="key">${escapeHtml(keyName)}:</span>${valHtml}</div>`;

      let currentView = 'overview';
      let report = null;

      function categoryFlag(id) {
        if (!report) return null;
        if (id === 'overview' || id === 'conflicts') {
          const worst = report.conflicts.reduce(
            (w, c) => (severityRank(c.severity) < severityRank(w) ? c.severity : w),
            'info',
          );
          return report.conflicts.length ? flagFromSeverity(worst) : 'ok';
        }
        if (id === 'livemonitor') {
          const worst = Monitor.log.find((l) => l.severity === 'critical')
            ? 'critical'
            : Monitor.log.find((l) => l.severity === 'high')
              ? 'high'
              : null;
          return worst ? flagFromSeverity(worst) : SETTINGS.monitoringEnabled ? 'ok' : null;
        }
        if (id === 'raw' || id === 'settings') return null;
        const cat = report.categorySummaries.find(
          (c) =>
            c.category === id ||
            (id === 'audio' && c.category === 'offlineAudioContext') ||
            (id === 'canvas' && c.category === 'canvasWebgl'),
        );
        if (!cat) return 'ok';
        return flagFromSeverity(cat.worstSeverity);
      }
      function renderSidebar() {
        const el = document.getElementById('sidebar');
        let html = '';
        CATS.forEach((g) => {
          html += `<div class="sb-group-label">${g.group}</div>`;
          g.items.forEach((it) => {
            const flag = categoryFlag(it.id);
            html += `<div class="nav-item ${it.id === currentView ? 'active' : ''}" data-nav="${it.id}">
              <span class="ic">${it.ic}</span><span>${it.label}</span>
              ${flag ? `<span class="flag ${flag}"></span>` : ''}
            </div>`;
          });
        });
        el.innerHTML = html;
        el.querySelectorAll('[data-nav]').forEach((n) => {
          n.addEventListener('click', () => {
            currentView = n.dataset.nav;
            renderSidebar();
            renderMain();
            document.getElementById('sidebar').classList.remove('open');
          });
        });
      }
      function renderIfActive(viewId) {
        if (currentView === viewId) renderMain();
        else renderSidebar();
      }
      function rebuildAndRender() {
        if (!DATA) return;
        report = buildReport(DATA);
        renderSidebar();

                  const risk = 100 - c.score;
                  const tone =

                  return `<div class="bar-row">
            <div class="lbl">${c.label}</div>

                .join('')
            : `<tr><td class="v empty-hint" colspan="2">No confirmed lies.</td></tr>`;
        const hc = report ? report.headlessConfidence : { pct: 0, label: 'N/A' };
        const score = report ? report.overallScore : 0;
        const grade = report ? report.grade : { letter: 'N/A', text: '' };
        const stats = report ? report.stats : { total: 0, categoriesAffected: 0 };

        return `
        <div class="page-head">
          <div><h1>Fingerprint Overview</h1><div class="sub">Scanned at ${m.scannedAt || 'now'} · ID <b>${m.fingerprintId || 'unknown'}</b> · scenario: <b>${SCENARIOS[currentScenario].label}</b></div></div>

                    stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"/>
                </svg>
                <div class="gauge-center"><b style="color:${scoreToColorVar(score)}">${score}</b><span>/ 100 · ${grade.letter}</span></div>
              </div>
              <div class="gauge-legend">

                <div class="row"><span>●</span> Categories affected: <b>${stats.categoriesAffected}</b></div>

            <div class="value ${hc.pct >= 55 ? 'bad' : hc.pct >= 25 ? 'warn' : 'ok'}">${hc.pct}%</div>

      function viewConflicts() {
        const circumference = 2 * Math.PI * 46;
        const score = report ? report.overallScore : 0;
        const grade = report ? report.grade : { letter: 'N/A', text: '' };
        const stats = report ? report.stats : { bySeverity: {}, total: 0, categoriesAffected: 0 };
        const hc = report ? report.headlessConfidence : { pct: 0, label: 'N/A' };
        return `
        <div class="page-head">
          <div><h1>Conflicts &amp; Score</h1><div class="sub">Full detailed breakdown of every conflict the engine detected${tipHtml('conflicts.overallGauge')}</div></div>
          <div class="actions"><button class="btn" id="exportConflictsBtn">⬇ Export this report</button></div>
        </div>

        <div class="grid cols-3">
          <div class="card" style="text-align:center;">
            <div class="gauge" style="margin:0 auto 8px;">
              <svg width="128" height="128" viewBox="0 0 128 128">
                <circle cx="64" cy="64" r="46" fill="none" stroke="var(--border)" stroke-width="9"/>
                <circle id="gaugeCircle2" cx="64" cy="64" r="46" fill="none" stroke="${scoreToColorVar(score)}" stroke-width="9" stroke-linecap="round"
                  stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}" transform="rotate(-90 64 64)"/>
              </svg>
              <div class="gauge-center"><b style="color:${scoreToColorVar(score)}">${score}</b><span>${grade.letter}</span></div>
            </div>
            <div class="delta">${grade.text}</div>
          </div>
          <div class="card stat-card">
            <div class="label">Headless Confidence</div>
            <div class="value ${hc.pct >= 55 ? 'bad' : hc.pct >= 25 ? 'warn' : 'ok'}">${hc.pct}%</div>
            <div class="delta">${hc.label}</div>
          </div>
          <div class="card">
            <div class="label" style="margin-bottom:8px;">Conflicts by Severity</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              ${SEVERITY_ORDER.map(
                (
                  s,
                ) => `<div class="stat-pill" style="flex:1;min-width:64px;text-align:center;padding:8px 6px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);">
                <div style="font-size:17px;font-weight:700;" class="badge-${s}" >${stats.bySeverity[s] || 0}</div>
                <div style="font-size:9.5px;color:var(--text-dim);">${SEVERITY_LABEL[s]}</div>
              </div>`,
              ).join('')}
            </div>
            <div class="delta" style="margin-top:8px;">${stats.total} conflicts across ${stats.categoriesAffected} categories</div>
          </div>
        </div>

        <div class="card" style="margin-top:14px;">
          <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="conflictSearch" placeholder="Search path / label / value..." style="flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12px;">
            <span class="tt">Severity filter${tipHtml('conflicts.severityChips')}</span>
            ${SEVERITY_ORDER.map((s) => `<div class="chip clickable active sev-${s}" data-sev="${s}">${SEVERITY_LABEL[s]}</div>`).join('')}
          </div>
        </div>

        <div class="section-heading">Per-Category Breakdown${tipHtml('conflicts.categoryAccordion')}</div>
        <div id="conflictCategoryList"></div>
        `;
      }

      function renderConflictCategoryList() {
        const wrap = document.getElementById('conflictCategoryList');
        if (!wrap) return;
        if (!report) {
          wrap.innerHTML = `<div class="empty-hint">No data yet.</div>`;
          return;
        }
        const q = (document.getElementById('conflictSearch')?.value || '').trim().toLowerCase();
        const activeSev = new Set(
          [...document.querySelectorAll('#main .chip[data-sev].active')].map((c) => c.dataset.sev),
        );
        const filtered = report.categorySummaries
          .map((cat) => {
            const items = cat.items.filter((c) => {
              if (!activeSev.has(c.severity)) return false;
              if (!q) return true;
              return `${c.label} ${c.path} ${c.value}`.toLowerCase().includes(q);
            });
            return Object.assign({}, cat, { visibleItems: items });
          })
          .filter((c) => c.visibleItems.length > 0);

        if (report.conflicts.length === 0) {
          wrap.innerHTML = `<div class="card" style="border-left:3px solid var(--accent);"><span style="color:var(--accent)">No conflicts found — this profile is fully internally consistent.</span></div>`;
          return;
        }
        if (filtered.length === 0) {
          wrap.innerHTML = `<div class="empty-hint">No conflicts match the current filters.</div>`;
          return;
        }
        wrap.innerHTML = filtered
          .map(
            (cat) => `
          <details class="card" style="margin-bottom:10px; padding:0;" open>
            <summary style="cursor:pointer; list-style:none; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
              <strong style="font-size:12.5px;">${cat.label} <span style="color:var(--text-dim); font-weight:normal;">(${cat.visibleItems.length})</span></strong>
              <span style="display:flex; align-items:center; gap:10px; font-size:11px; color:var(--text-dim);">
                <span class="bar-track" style="width:90px; display:inline-block;"><div class="bar-fill ${cat.score >= 85 ? '' : cat.score >= 50 ? 'warn' : 'bad'}" style="width:${cat.score}%"></div></span>
                <span>${cat.score}/100</span>
              </span>
            </summary>
            <div style="padding:0 16px 14px;">
              ${cat.visibleItems
                .map(
                  (c) => `
                <div style="padding:10px 12px;border-left:3px solid var(--border);margin-bottom:8px;background:var(--panel-2);border-radius:6px;">
                  <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;">
                    <strong style="font-size:12px;">${escapeHtml(c.label)}</strong>
                    <span class="badge badge-${c.severity}">${SEVERITY_LABEL[c.severity]}</span>
                  </div>
                  <div style="color:var(--text-dim);font-size:11px;margin-top:3px;">${escapeHtml(c.path)}</div>
                  <div style="color:var(--info);font-size:11.5px;margin-top:4px;word-break:break-all;">${escapeHtml(String(c.value))}</div>
                  <div style="color:var(--text-dim);font-size:11.5px;margin-top:4px;">${escapeHtml(c.description)}</div>
                </div>
              `,
                )
                .join('')}
            </div>
          </details>
        `,
          )
          .join('');
      }

      function viewSettings() {
        return `
        <div class="page-head"><div><h1>Settings</h1><div class="sub">Everything here applies immediately for the current session; nothing is written to disk.</div></div></div>

          <div class="setting-row">

                <option value="30000" ${SETTINGS.pollIntervalMs === 30000 ? 'selected' : ''}>30 seconds</option>

          </div>
          <div class="setting-row">
            <div class="setting-copy"><div class="t">Sound on alert${tipHtml('settings.sound')}</div><div class="d">Plays a short locally-synthesized tone whenever a banner alert appears.</div></div>
            <div class="setting-control"><span class="toggle"><input type="checkbox" id="setSound" ${SETTINGS.soundAlert ? 'checked' : ''}><span class="track"></span></span></div>
          </div>
          <div class="setting-row">
            <div class="setting-copy"><div class="t">Show field tooltips${tipHtml('settings.tooltips')}</div><div class="d">Globally shows or hides every "?" tooltip icon across the interface.</div></div>
            <div class="setting-control"><span class="toggle"><input type="checkbox" id="setTooltips" ${SETTINGS.tooltipsEnabled ? 'checked' : ''}><span class="track"></span></span></div>

        <div class="page-head" style="margin-top:20px;">

      /* ============================================================================================
         9. MAIN RENDER + WIRING
         ============================================================================================ */
      const VIEW_FN = {
        overview: viewOverview,
        navigator: viewNavigator,
        screen: viewScreen,
        headless: viewHeadless,
        livemonitor: viewLiveMonitor,
        consistency: viewConsistency,
        canvas: viewCanvas,
        svg: viewSvg,
        audio: viewAudio,
        fonts: viewFonts,
        timezone: viewTimezone,
        maths: viewMaths,
        features: viewFeatures,
        conflicts: viewConflicts,
        lies: viewLies,
        raw: viewRaw,
        settings: viewSettings,
      };

      function renderMain() {
        const el = document.getElementById('main');
        const fn = VIEW_FN[currentView] || viewOverview;
        el.innerHTML = `<div class="view active">${fn()}</div>`;

        if (currentView === 'overview' && report) {
          requestAnimationFrame(() => {
            const circ = document.getElementById('gaugeCircle');
            const circumference = 2 * Math.PI * 54;
            const offset = circumference * (1 - report.overallScore / 100);
            requestAnimationFrame(() => (circ.style.strokeDashoffset = offset));
            document.querySelectorAll('.bar-fill').forEach((b) => {
              const w = b.style.width;
              b.style.width = '0';
              requestAnimationFrame(() => requestAnimationFrame(() => (b.style.width = w)));
            });
          });
        }

        if (currentView === 'conflicts' && report) {
          requestAnimationFrame(() => {
            const circ = document.getElementById('gaugeCircle2');
            const circumference = 2 * Math.PI * 46;
            const offset = circumference * (1 - report.overallScore / 100);
            requestAnimationFrame(() => (circ.style.strokeDashoffset = offset));
          });
          renderConflictCategoryList();
          const search = document.getElementById('conflictSearch');
          if (search) search.addEventListener('input', renderConflictCategoryList);
          document.querySelectorAll('#main .chip[data-sev]').forEach((chip) => {
            chip.addEventListener('click', () => {
              chip.classList.toggle('active');
              renderConflictCategoryList();
            });
          });
          const exportBtn = document.getElementById('exportConflictsBtn');
          if (exportBtn) exportBtn.addEventListener('click', exportReport);
        }

        if (currentView === 'raw' && DATA) {
          document.querySelectorAll('[data-toggle]').forEach((t) => {
            t.addEventListener('click', () => {
              const target = document.getElementById(t.dataset.toggle);
              const collapsed = target.style.display === 'none';
              target.style.display = collapsed ? 'block' : 'none';
              t.textContent = collapsed ? '▾' : '▸';
            });
          });
          document.getElementById('expandAllBtn')?.addEventListener('click', () => {
            document
              .querySelectorAll('#rawTree [id^="n"]')
              .forEach((n) => (n.style.display = 'block'));
            document
              .querySelectorAll('#rawTree [data-toggle]')
              .forEach((t) => (t.textContent = '▾'));
          });
          document.getElementById('collapseAllBtn')?.addEventListener('click', () => {
            document
              .querySelectorAll('#rawTree [id^="n"]')
              .forEach((n) => (n.style.display = 'none'));
            document
              .querySelectorAll('#rawTree [data-toggle]')
              .forEach((t) => (t.textContent = '▸'));
          });
        }

        if (currentView === 'livemonitor') {
          document.getElementById('monitorToggle').addEventListener('change', (e) => {
            SETTINGS.monitoringEnabled = e.target.checked;
            applySettingsSideEffects();
            renderSidebar();
          });
          document.getElementById('monitorInterval').addEventListener('change', (e) => {
            SETTINGS.pollIntervalMs = parseInt(e.target.value, 10);
            if (SETTINGS.monitoringEnabled) Monitor.start(SETTINGS.pollIntervalMs);
          });
          document.getElementById('captureBaselineBtn').addEventListener('click', () => {
            Monitor.captureBaseline();
            toast('Baseline captured.');
            renderMain();
          });
          document.getElementById('forceCheckBtn').addEventListener('click', () => {
            Monitor.poll();
            renderMain();
            toast('Re-check complete.');
          });
          document.getElementById('simulateDemoBtn').addEventListener('click', () => {
            Monitor.simulateDemoAlert();
          });
          document.querySelectorAll('[data-scenario]').forEach((btn) => {
            btn.addEventListener('click', () => applyScenario(btn.dataset.scenario));
          });
        }

        if (currentView === 'settings') {
          document.getElementById('setMonitoring').addEventListener('change', (e) => {
            SETTINGS.monitoringEnabled = e.target.checked;
            applySettingsSideEffects();
            renderSidebar();
          });
          document.getElementById('setInterval').addEventListener('change', (e) => {
            SETTINGS.pollIntervalMs = parseInt(e.target.value, 10);
            if (SETTINGS.monitoringEnabled) Monitor.start(SETTINGS.pollIntervalMs);
          });
          document.getElementById('setAlertCritical').addEventListener('change', (e) => {
            SETTINGS.alertOnCritical = e.target.checked;
          });
          document.getElementById('setAlertHigh').addEventListener('change', (e) => {
            SETTINGS.alertOnHigh = e.target.checked;
          });
          document.getElementById('setSound').addEventListener('change', (e) => {
            SETTINGS.soundAlert = e.target.checked;
          });
          document.getElementById('setTooltips').addEventListener('change', (e) => {
            SETTINGS.tooltipsEnabled = e.target.checked;
            applySettingsSideEffects();
          });
          document.querySelectorAll('.swatch').forEach((sw) => {
            sw.addEventListener('click', () => {
              SETTINGS.accent = sw.dataset.accent;
              applyAccent(sw.dataset.accent, sw.dataset.dim);
              renderMain();
            });
          });
          document.getElementById('resetSettingsBtn').addEventListener('click', () => {
            Object.assign(SETTINGS, {
              monitoringEnabled: false,
              pollIntervalMs: 15000,
              alertOnCritical: true,
              alertOnHigh: true,
              soundAlert: true,
              tooltipsEnabled: true,
              accent: '#35e39a',
            });
            applyAccent('#35e39a', '#1c6e4c');
            applySettingsSideEffects();
            renderSidebar();
            renderMain();
            toast('Settings reset to defaults.');
          });
        }
      }

      function exportReport() {
        if (!DATA || !report) return;
        const exportData = {
          generatedAt: new Date().toISOString(),
          scenario: currentScenario,
          fingerprintId: DATA.meta?.fingerprintId || 'unknown',
          overallScore: report.overallScore,
          grade: report.grade,
          headlessConfidence: report.headlessConfidence,
          stats: report.stats,
          conflicts: report.conflicts,
          categorySummaries: report.categorySummaries.map((c) => ({
            category: c.category,
            label: c.label,
            score: c.score,
            count: c.count,
            worstSeverity: c.worstSeverity,
          })),
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `signal-report-${DATA.meta?.fingerprintId || 'unknown'}.json`;
        a.click();
        URL.revokeObjectURL(url);
        toast('Report exported.');
      }

      /* ============================================================================================
         10. TOOLTIP ENGINE
         ============================================================================================ */
      const tipPop = document.getElementById('tooltipPop');
      function positionTip(target) {
        const r = target.getBoundingClientRect();
        const tw = tipPop.offsetWidth,
          th = tipPop.offsetHeight;
        let left = r.left + r.width / 2 - tw / 2;
        let top = r.top - th - 10;
        if (top < 8) top = r.bottom + 10;
        left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
        tipPop.style.left = left + 'px';
        tipPop.style.top = top + 'px';
      }
      function showTipFor(target) {
        const data = TOOLTIPS[target.dataset.tipId];
        if (!data) return;
        document.getElementById('tipTitle').textContent = data.title;
        document.getElementById('tipBody').textContent = data.body;
        tipPop.classList.add('show');
        positionTip(target);
      }
      function hideTip() {
        tipPop.classList.remove('show');
      }
      document.addEventListener('mouseover', (e) => {
        const t = e.target.closest('.qmark');
        if (t) showTipFor(t);
      });
      document.addEventListener('mouseout', (e) => {
        const t = e.target.closest('.qmark');
        if (t) hideTip();
      });
      document.addEventListener('focusin', (e) => {
        const t = e.target.closest('.qmark');
        if (t) showTipFor(t);
      });
      document.addEventListener('focusout', (e) => {
        const t = e.target.closest('.qmark');
        if (t) hideTip();
      });
      document.addEventListener('click', (e) => {
        const t = e.target.closest('.qmark');
        if (t) {
          e.stopPropagation();
          showTipFor(t);
        }
      });
      window.addEventListener('scroll', hideTip, true);

      /* ============================================================================================
         11. SEARCH (filters Raw JSON view by key/value)
         ============================================================================================ */
      document.getElementById('searchInput').addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        if (!q) {
          if (currentView === 'raw') renderMain();
          return;
        }
        if (currentView !== 'raw') {
          currentView = 'raw';
          renderSidebar();
          renderMain();
        }
        const tree = document.getElementById('rawTree');
        if (!tree) return;
        const allRows = tree.querySelectorAll('.row');
        allRows.forEach((row) => {
          const txt = row.textContent.toLowerCase();
          const match = txt.includes(q);
          row.style.opacity = match ? '1' : '0.28';
          if (match) {
            let p = row.closest('.tree-node')?.parentElement;
            while (p && p.id && p.id.startsWith('n')) {
              p.style.display = 'block';
              const tg = document.querySelector(`[data-toggle="${p.id}"]`);
              if (tg) tg.textContent = '▾';
              p = p.parentElement.closest('[id^="n"]');
            }
          }
        });
      });

      /* ============================================================================================
         12. TOP-LEVEL EVENTS
         ============================================================================================ */
      document
        .getElementById('menuBtn')
        .addEventListener('click', () =>
          document.getElementById('sidebar').classList.toggle('open'),
        );
      document
        .getElementById('hashChip')
        .addEventListener('click', () => copyText(DATA?.meta?.fingerprintId || 'unknown'));
      document.getElementById('rescanBtn').addEventListener('click', () => {
        toast('Re-running scan...');
        // Re-run bằng cách tải lại dữ liệu từ creep.js
        waitForCreep((fp, creep) => {
          CREEP = creep;
          const meta = buildMetaFromFingerprint(fp);
          DATA = { ...fp, meta };
          document.querySelector('.hash-chip b').textContent = meta.fingerprintId;
          report = buildReport(DATA);
          renderSidebar();
          renderMain();
          toast('Scan refreshed.');
        });
      });
      document.getElementById('exportBtn').addEventListener('click', exportReport);

      /* ============================================================================================
         INIT — chờ creep.js load
         ============================================================================================ */
      initData();
    </script>
  </body>
</html>
