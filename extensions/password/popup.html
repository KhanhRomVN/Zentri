<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zentri Password Manager</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 12px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        color: #e5e7eb;
        background: #0b1220;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .header h1 {
        font-size: 14px;
        font-weight: 700;
        margin: 0;
      }
      button {
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        padding: 5px 10px;
        transition: background 0.15s;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      button.primary {
        background: rgba(54, 134, 255, 0.18);
        border-color: rgba(54, 134, 255, 0.4);
        color: #7cb2ff;
      }
      button.primary:hover {
        background: rgba(54, 134, 255, 0.28);
      }
      button.danger {
        background: transparent;
        border: none;
        padding: 2px 6px;
        color: #f87171;
        font-size: 14px;
        line-height: 1;
      }
      form {
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
      }
      form.open {
        display: flex;
      }
      form input {
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.25);
        color: inherit;
        font-size: 12px;
        font-family: inherit;
      }
      form input:focus {
        outline: none;
        border-color: rgba(54, 134, 255, 0.5);
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 4px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 320px;
        overflow-y: auto;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      li .info {
        min-width: 0;
        flex: 1;
      }
      li .username {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li .url {
        font-size: 11px;
        color: #94a3b8;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        padding: 24px 0;
        text-align: center;
        color: #64748b;
        font-size: 12px;
      }
      .footer {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 10px;
        color: #64748b;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Passwords</h1>
      <button id="add-btn" class="primary">+ Add</button>
    </div>

    <form id="form">
      <input id="url" type="url" placeholder="https://example.com" required />
      <input id="username" type="text" placeholder="Username / Email" />
      <input id="password" type="password" placeholder="Password" required />
      <div class="form-actions">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>

    <ul id="list"></ul>

    <div class="footer">Stored in this profile via chrome.storage.local</div>

    <script src="popup.js"></script>
  </body>
</html>
